name: Build 3DS CIA

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    # devkitPro publishes devkitARM images on Docker Hub with the 3DS
    # toolchain (libctru, citro2d, SDL2 cross files, makerom, bannertool).
    runs-on: ubuntu-latest
    container: docker.io/devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install makerom + bannertool via devkitPro pacman
        run: |
          export DEVKITPRO=/opt/devkitpro
          dkp-pacman -Sy --noconfirm || echo "sync failed"
          dkp-pacman -S --noconfirm --needed makerom bannertool || \
            { echo "=== pacman install failed; dump state ==="; \
              ls -la /opt/devkitpro/tools/bin/ || true; \
              command -v makerom || true; command -v bannertool || true; }

      - name: Build
        env:
          ZELDA3_TOOLS_ROOT: /opt/devkitpro/tools/bin
        run: |
          chmod +x platform/3ds/build.sh
          platform/3ds/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-3ds-cn
          path: |
            build-3ds/game/*.cia
            build-3ds/game/*.3dsx
            cn_language.bin
          if-no-files-found: warn
