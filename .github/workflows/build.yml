name: Build 3DS CIA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # devkitPro publishes devkitARM images on Docker Hub with the 3DS
    # toolchain (devkitARM, libctru, citro2d, SDL2 cross files).
    runs-on: ubuntu-latest
    container: docker.io/devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build makerom + bannertool from source
        run: |
          set -e
          echo "== host compilers ==" ; which gcc g++ cc make cmake git || true
          mkdir -p /opt/tools
          # --- makerom (3DSGuy/Project_CTR) ---
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/pctr
          make -C /tmp/pctr/makerom deps >/dev/null 2>&1
          make -C /tmp/pctr/makerom -j"$(nproc)"
          cp /tmp/pctr/makerom/bin/makerom /opt/tools/makerom
          # --- bannertool (Epicpkmn11 fork) ---
          git clone --depth 1 https://github.com/Epicpkmn11/bannertool.git /tmp/bt
          # its "buildtools" submodule uses the blocked git:// protocol, so
          # fetch it over https into the expected location instead.
          git clone --depth 1 https://github.com/Steveice10/buildtools.git /tmp/bt/buildtools
          git -C /tmp/bt tag 1.2.3 2>/dev/null || true   # no 'v' prefix so VERSION_MAJOR parses to a number
          make -C /tmp/bt -j"$(nproc)"
          cp /tmp/bt/output/linux-x86_64/bannertool /opt/tools/bannertool
          chmod +x /opt/tools/makerom /opt/tools/bannertool
          ls -la /opt/tools/

      - name: Build (3DSX + CIA)
        env:
          ZELDA3_TOOLS_ROOT: /opt/tools
        run: |
          chmod +x platform/3ds/build.sh
          platform/3ds/build.sh

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-3ds-cn
          path: |
            build-3ds/game/*.cia
            build-3ds/game/*.3dsx
            cn_language.bin
          if-no-files-found: warn

      - name: Publish rolling-latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # gh isn't preinstalled in the devkitARM container, so fetch the
          # self-contained static binary.
          curl -sL https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz | tar xz -C /tmp
          GH=/tmp/gh_2.98.0_linux_amd64/bin/gh
          $GH --version
          # git in the container runs as a different owner; whitelist the checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Remove every existing release/tag so only the newest build remains.
          $GH release list --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            $GH release delete "$t" --yes 2>/dev/null || true
          done
          # Publish the current build as the single rolling "latest" release.
          $GH release create latest \
            --title "Zelda ALTTP 3DS 中文版 — latest" \
            --notes "最新构建（内置简体中文）。含 3DSX + CIA + cn_language.bin。" \
            --target "$GITHUB_SHA" \
            build-3ds/game/*.cia build-3ds/game/*.3dsx cn_language.bin \
            --latest
