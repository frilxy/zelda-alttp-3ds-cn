name: Build 3DS CIA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # devkitPro publishes devkitARM images on Docker Hub with the 3DS
    # toolchain (devkitARM, libctru, citro2d, SDL2 cross files).
    runs-on: ubuntu-latest
    container: docker.io/devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build makerom + bannertool from source
        run: |
          set -e
          echo "== host compilers ==" ; which gcc g++ cc make cmake git || true
          mkdir -p /opt/tools
          # --- makerom (3DSGuy/Project_CTR) ---
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/pctr
          make -C /tmp/pctr/makerom deps >/dev/null 2>&1
          make -C /tmp/pctr/makerom -j"$(nproc)"
          cp /tmp/pctr/makerom/bin/makerom /opt/tools/makerom
          # --- bannertool (Epicpkmn11 fork) ---
          git clone --depth 1 https://github.com/Epicpkmn11/bannertool.git /tmp/bt
          # its "buildtools" submodule uses the blocked git:// protocol, so
          # fetch it over https into the expected location instead.
          git clone --depth 1 https://github.com/Steveice10/buildtools.git /tmp/bt/buildtools
          git -C /tmp/bt tag 1.2.3 2>/dev/null || true   # no 'v' prefix so VERSION_MAJOR parses to a number
          make -C /tmp/bt -j"$(nproc)"
          cp /tmp/bt/output/linux-x86_64/bannertool /opt/tools/bannertool
          chmod +x /opt/tools/makerom /opt/tools/bannertool
          ls -la /opt/tools/

      - name: Updater dependencies (curl, mbedTLS, Jansson)
        run: |
          set -e
          DEPS="${DEVKITPRO}/portlibs/3ds"
          have_deps() {
            for l in curl jansson mbedtls mbedx509 mbedcrypto; do
              [ -f "$1/lib/lib$l.a" ] || return 1
            done
          }
          echo "== what this image already ships =="
          ls "$DEPS/lib" 2>/dev/null | head -60 || true
          dkp-pacman -Q 2>/dev/null | grep -iE '3ds-(curl|mbedtls|jansson)' || echo "  (no updater deps installed)"
          if ! have_deps "$DEPS"; then
            echo "== installing the devkitPro packages =="
            dkp-pacman -S --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-jansson || \
              dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-jansson || \
              echo "::warning::devkitPro repository unreachable, building from source"
          fi
          # Verify the prefix instead of trusting pacman's exit status: fall back
          # to the in-tree build script when the libraries really aren't there.
          if have_deps "$DEPS"; then
            echo "UPDATE_DEPS_ROOT=$DEPS" >> "$GITHUB_ENV"
          else
            echo "== building updater dependencies from source =="
            bash platform/3ds/update-dependencies/build-deps.sh "$PWD/.deps/prefix"
            echo "UPDATE_DEPS_ROOT=$PWD/.deps/prefix" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV"

      - name: Build (3DSX + CIA), both variants
        env:
          ZELDA3_TOOLS_ROOT: /opt/tools
        run: |
          chmod +x platform/3ds/build.sh
          echo "== standard (dialogue Chinese, bottom screen English) =="
          platform/3ds/build.sh
          echo "== bottom-screen Chinese version =="
          BOTTOM_SCREEN_CN=1 platform/3ds/build.sh

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-3ds-cn
          path: |
            build-3ds/game/*.cia
            build-3ds/game/*.3dsx
            build-3ds-cn-bottom/game/*.cia
            build-3ds-cn-bottom/game/*.3dsx
            cn_language.bin
          if-no-files-found: warn

      - name: Publish rolling-latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # gh isn't preinstalled in the devkitARM container, so fetch the
          # self-contained static binary.
          curl -sL https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz | tar xz -C /tmp
          GH=/tmp/gh_2.98.0_linux_amd64/bin/gh
          $GH --version
          # git in the container runs as a different owner; whitelist the checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Remove every release (and its tag) except the rolling "latest".
          $GH release delete latest --yes --cleanup-tag 2>/dev/null || true
          $GH release list --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            [ "$t" != "latest" ] && $GH release delete "$t" --yes --cleanup-tag 2>/dev/null || true
          done
          # Create the (empty) rolling "latest" release, then upload build assets
          # separately; splitting create from upload avoids an upload race.
          $GH release create latest \
            --title "Zelda ALTTP 3DS 中文版 — latest" \
            --notes "最新构建（内置简体中文）。含 3DSX + CIA + cn_language.bin。带下屏汉化版（*-cn-bottom）。" \
            --target "$GITHUB_SHA" \
            --latest
          for f in build-3ds/game/*.cia build-3ds/game/*.3dsx \
                   build-3ds-cn-bottom/game/*.cia build-3ds-cn-bottom/game/*.3dsx \
                   cn_language.bin; do
            $GH release upload latest "$f" --clobber 2>/dev/null || echo "warn: could not upload $f"
          done
