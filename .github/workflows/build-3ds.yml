name: Build 3DS

# Builds the branch's 3DSX and CIA so a change can be checked on hardware
# without a local devkitPro install. Publishing stays with the release
# workflow; this one only uploads an Actions artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build makerom + bannertool
        run: |
          set -e
          echo "== host compilers ==" ; which gcc g++ cc make cmake git || true
          mkdir -p /opt/tools
          # --- makerom (3DSGuy/Project_CTR) ---
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/pctr
          make -C /tmp/pctr/makerom deps >/dev/null 2>&1
          make -C /tmp/pctr/makerom -j"$(nproc)"
          cp /tmp/pctr/makerom/bin/makerom /opt/tools/makerom
          # --- bannertool (Epicpkmn11 fork) ---
          git clone --depth 1 https://github.com/Epicpkmn11/bannertool.git /tmp/bt
          # its "buildtools" submodule uses the blocked git:// protocol, so
          # fetch it over https into the expected location instead.
          git clone --depth 1 https://github.com/Steveice10/buildtools.git /tmp/bt/buildtools
          git -C /tmp/bt tag 1.2.3 2>/dev/null || true   # no 'v' prefix so VERSION_MAJOR parses to a number
          make -C /tmp/bt -j"$(nproc)"
          cp /tmp/bt/output/linux-x86_64/bannertool /opt/tools/bannertool
          chmod +x /opt/tools/makerom /opt/tools/bannertool
          ls -la /opt/tools/

      - name: Updater dependencies (curl, mbedTLS, Jansson)
        run: |
          set -e
          DEPS="${DEVKITPRO}/portlibs/3ds"
          have_deps() {
            for l in curl jansson mbedtls mbedx509 mbedcrypto; do
              [ -f "$1/lib/lib$l.a" ] || return 1
            done
          }
          echo "== what this image already ships =="
          ls "$DEPS/lib" 2>/dev/null || true
          dkp-pacman -Q 2>/dev/null | grep -iE '3ds-(curl|mbedtls|jansson)' || echo "  (no updater deps installed)"
          if ! have_deps "$DEPS"; then
            echo "== installing the devkitPro packages =="
            dkp-pacman -S --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-jansson || \
              dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-jansson || \
              echo "::warning::devkitPro repository unreachable, building from source"
          fi
          # Verify the prefix instead of trusting pacman's exit status: fall back
          # to the in-tree build script when the libraries really aren't there.
          if have_deps "$DEPS"; then
            echo "UPDATE_DEPS_ROOT=$DEPS" >> "$GITHUB_ENV"
          else
            echo "== building updater dependencies from source =="
            bash platform/3ds/update-dependencies/build-deps.sh "$PWD/.deps/prefix"
            echo "UPDATE_DEPS_ROOT=$PWD/.deps/prefix" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV"

      - name: Install the Chinese language pack
        run: |
          # The pack carries translated game text, so this branch does not
          # commit it; the 3.2 line (kept as backup/v3.2-cn) carries the file.
          # Without it the build still compiles, but the artifact would have no
          # Chinese in it.
          # The container runs as root and the checkout belongs to the runner,
          # so git needs the workspace whitelisted before it will read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth 1 origin backup/v3.2-cn
          git show FETCH_HEAD:cn_language.bin > platform/3ds/romfs/languages/zh.bin
          # The 3.2 pack names glyphs with the bytes 0x6f..0x73, which are also
          # the letters o, p, q, r and s, and upstream v4.1 gave the page bytes
          # 0xf0..0xf4 to the Japanese font pages. Migrate it here, from the
          # same untouched source, so the tree keeps no binary and the result
          # is reproducible.
          # The eight upstream languages are patches from their own cartridges
          # (de/fr/ja Nintendo's, es/pt/it/ru fan translations). They ride the
          # same backup branch the pack does, so the tree keeps no binary and
          # every language the selector offers can actually be built.
          git fetch --depth 1 origin backup/languages-v4
          for code in de es fr it ja pt ru; do
            git show FETCH_HEAD:$code.bps > platform/3ds/romfs/languages/$code.bps
          done
          python3 tools/languages/reencode_pages.py platform/3ds/romfs/languages/zh.bin
          ls -l platform/3ds/romfs/languages/zh.bin
          if command -v python3 >/dev/null; then
            python3 tools/languages/reencode_pages.py --check platform/3ds/romfs/languages/zh.bin
            python3 tools/languages/check_language_pack.py platform/3ds/romfs/languages/zh.bin
            # The patch is the cartridge form of the same pack: the selector
            # applies it like any other language patch, and the pack stays as
            # the fallback for a build without it. Generated here so every
            # release exercises that path on hardware.
            python3 tools/languages/make_zh_bps.py \
              platform/3ds/romfs/languages/zh.bin \
              platform/3ds/romfs/languages/zh.bps
            ls -l platform/3ds/romfs/languages/
            # A UI string whose glyph is missing from the baked table draws as
            # '?', which only shows on a console; these tests catch it here.
            # They need a host compiler and are time boxed so a missing one
            # cannot stall the build.
            # Only the switch test runs here: it walks every Chinese string and
            # fails when a glyph is missing from any of the three baked sizes,
            # which is the failure that reaches a console as '?'. The other host
            # tests need libs the container lacks and are run locally.
            if command -v cc >/dev/null 2>&1; then
              CC=cc timeout 120 python3 platform/3ds/tests/run_language_switch_test.py \
                || echo "language switch test failed"
            else
              echo "no host cc; skipping the language switch test"
            fi
          fi

      - name: Build 3DSX and CIA
        env:
          ZELDA3_TOOLS_ROOT: /opt/tools
        run: |
          chmod +x platform/3ds/build.sh
          platform/3ds/build.sh

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: zelda3-3ds-zh
          path: |
            build-3ds/game/*.cia
            build-3ds/game/*.3dsx
          if-no-files-found: error

      - name: Build log tail
        if: always()
        run: |
          ls -la build-3ds/game 2>/dev/null || true
