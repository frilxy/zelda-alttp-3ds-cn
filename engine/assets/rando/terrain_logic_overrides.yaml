  # capability gates the dungeon door, not this overworld rock.
  - {lo: 0x0F50, hi: 0x0F50, gate: 'HAS_ITEM(Flippers) OR CanFakeFlippers() OR CanBootsClip() OR CanOneFrameClipOW() OR (CanSuperSpeed() AND CanSpinSpeed())'}
