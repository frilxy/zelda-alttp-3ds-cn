- screen: 0x68
  region: DarkWorld_South
  # Digging-game area: ALTTPR places it in DW South
  # (Standard/DarkWorld/South.php), NOT the mirror-derived NW — the DW fence
  # line puts the whole row-5 band in South.
- screen: 0x69
  region: DarkWorld_South
  # Same DW fence-line band as 0x68 (the field between the digging game and
