- screen: 0x6A
  confirmed: Stumpy grove has no registrable terrain objects.
- screen: 0x75
  ranges:
  # Inverted-only heavy rock on Ice Palace island (row 30 col 40), beside the
  # entrance at 43,28. Preserve the rock's class-level Mitt gate and add only
