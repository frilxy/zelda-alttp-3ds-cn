  - name: CanGetGoodBee
    parameters: []
    body: "HAS_ITEM(BugCatchingNet) AND HasABottle() AND (HAS_ITEM(Boots) OR (HAS_ITEM(Quake) AND (OP_MODEWEAPONS_EQ(swordless) OR HasSword(1))))"
    source: "app/Support/ItemCollection.php:612-618"
    notes: |
