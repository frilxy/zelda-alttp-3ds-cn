  - name: CanBunnyRevival
    parameters: [world]
    body: "OP_TRICK(bunny_revival) AND CanBunnyRevive(world)"
    source: "ALTTPR `canBunnyRevive` config flag (customizer toggle, NOT a logic-level flag)"
    notes: |
      Bunny-state recovery mid-movement. Composes with the CanBunnyRevive
      bottle+net prereq macro (already in Phase A).

      DELIBERATELY trick-bit-only, NOT folded with a glitch level (unlike
      CanBootsClip/CanFakeFlippers/CanPearlBypass in Phase D §5). `canBunnyRevive`
      is NOT enabled by ANY entry in config/logic.php — the OWG/HMG/MG flag sets
      use `canSuperBunny` + `canDungeonRevive`, never `canBunnyRevive` (verified
      by an apply-time grep: `canBunnyRevive => true` appears nowhere in config/).
      It is a standalone customizer toggle upstream. Folding a glitch-level
      disjunct here would over-reach. Do NOT "fix" this to match the siblings.

  - name: CanPearlBypass
    parameters: []
    body: "(OP_TRICK(pearl_bypass) OR (OP_GLITCH_LEVEL_AT_LEAST(major_glitches) AND (NOT OP_GLITCH_LEVEL_AT_LEAST(hybrid_major_glitches)))) AND HasABottle()"
    source: "config/logic.php:33 (canOWYBA @ MajorGlitches ONLY) + region `config('canOWYBA') && hasABottle()`"
    notes: |
      ALTTPR `config('canOWYBA', false) && $items->hasABottle()` — Over-World
      Y-Button-Aim, the bottle-assisted dark-world bunny traversal. canOWYBA is a
      MajorGlitches-EXCLUSIVE flag: config/logic.php enables it ONLY at
      MajorGlitches (line 33), NOT at OverworldGlitches or HybridMG.

      Because the fork enum numbers MajorGlitches=2 < HybridMajorGlitches=3, the
      monotone OP_GLITCH_LEVEL_AT_LEAST(>=) cannot express "MG but not HMG" with a
      single threshold. The MG-exclusive form is
      `OP_GLITCH_LEVEL_AT_LEAST(major_glitches) AND NOT
      OP_GLITCH_LEVEL_AT_LEAST(hybrid_major_glitches)`, true only at logic==2
      (at logic==4 NoLogic it is false, but NoLogic short-circuits reachability,
      so it never matters). See design.md D4 + the glitch-logic-tier-model memo.

      Phase D (§5) folds this in; the trick bit stays an independent fork opt-in;
      the bottle prereq applies to BOTH paths. Usage:
      `HAS_ITEM(MoonPearl) OR CanPearlBypass()`. Default (logic=0, tricks=0) →
      false → digest-identical. MG seeds move (OWYBA now in logic at MG);
      HMG/OWG seeds do NOT gain OWYBA (correct — MG-exclusive).

