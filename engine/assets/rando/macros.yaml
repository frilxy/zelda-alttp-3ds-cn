  # ===========================================================================
  # F2 — first-class technique macros for the un-modeled glitch techniques
  # (add-rando-major-glitch frontier F2). ALTTPR's `config('canX', false)` flags
  # that have NO fork trick bit and were previously stood in for by the raw
  # OP_GLITCH_LEVEL_AT_LEAST(major_glitches) threshold at ~40 sites. These are
  # PURE TECHNIQUE GATES (the `config('canX')` half only) — the per-site item
  # conjunct stays at the call site, exactly as the PHP composes
  # `config('canX') && <site items>` (the same item can differ per site, e.g.
  # canSuperSpeed pairs with canSpinSpeed() at most sites but has('PegasusBoots')
  # at GanonsTower.php:410, so the item CANNOT be baked into the macro).
  #
  # Tier→threshold (config/logic.php, the fork enum NoGlitches=0..NoLogic=4):
  #   OWG-group       → OP_GLITCH_LEVEL_AT_LEAST(overworld_glitches)  (>=1; OWG/HMG/MG)
  #   canOneFrameClipUW → OP_GLITCH_LEVEL_AT_LEAST(major_glitches)    (>=2; HMG+MG only,
  #                       since the only non-short-circuited levels >=2 are {MG=2,HMG=3})
  #   MG-exclusive    → OP_GLITCH_LEVEL_AT_LEAST(major_glitches) AND
  #                     (NOT OP_GLITCH_LEVEL_AT_LEAST(hybrid_major_glitches))  (true only at MG=2)
  #
  # DIGEST-NEUTRAL until wired: defining a macro that no predicate references
  # emits no bytecode change. The ~40 raw threshold sites still read
  # OP_GLITCH_LEVEL_AT_LEAST(major_glitches) until F1 reclassifies each to its
  # matching macro here. Default (logic=0) → every macro false → unchanged.
  # ===========================================================================
  - name: CanSuperSpeed
    parameters: []
    body: "OP_GLITCH_LEVEL_AT_LEAST(overworld_glitches)"
    source: "config/logic.php:8,17,27 (canSuperSpeed @ OWG/HMG/MG)"
    notes: |
      ALTTPR `config('canSuperSpeed', false)` — boots-dash superspeed traversal.
      OWG-group flag (OWG line 8, HMG 17, MG 27). Composes at sites with the
      item helper, e.g. `CanSuperSpeed() AND CanSpinSpeed()` (DesertPalace.php:100,
      IcePalace.php:146) or `CanSuperSpeed() AND HAS_ITEM(Boots)`
      (GanonsTower.php:410). Restored + owner-playtest-confirmed on US 1.0
      (Superspeed, add-jp-glitch-restoration) but has no independent trick bit,
      so rom_version_status rides the overworld_glitches level (still untested —
      the level bundles un-restored techniques). See OVERNIGHT_REPORT ledger.

  - name: CanSuperBunny
