  - name: CanMirrorWrap
    parameters: []
    body: "OP_GLITCH_LEVEL_AT_LEAST(major_glitches) AND (NOT OP_GLITCH_LEVEL_AT_LEAST(hybrid_major_glitches))"
    source: "config/logic.php:31 (canMirrorWrap @ MajorGlitches ONLY)"
    notes: |
      ALTTPR `config('canMirrorWrap', false)` — mirror screen-wrap. MajorGlitches-
      EXCLUSIVE flag (line 31; absent from OWG and HMG). The MG-exclusive form
      OP_GLITCH_LEVEL_AT_LEAST(major_glitches) AND NOT
      OP_GLITCH_LEVEL_AT_LEAST(hybrid_major_glitches) is true only at logic==2
      (the non-monotonic-enum problem — see CanPearlBypass + design.md D4).
      US-1.0 status = CROSS-VERSION gameplay (deeper romdiff 2026-06-09 CORRECTS
      an earlier "us10-different" misread): in MirrorWarp_FinalizeAndLoadDestination
      ($82B260) the warp DESTINATION + Link position + screen-index + camera/scroll
      math is BYTE-IDENTICAL JP↔US. The ONLY JP↔US delta is the destination
      screen's overworld MUSIC + ambient-sound selection (the "$7F5B00,x table" is
      `overworld_music[]`, a WRAM scratch buffer, NOT a destination table; writes
      differ only at $12C music_control / $12D sound_effect_ambient). So the wrap
      behaves identically on both ROMs — canMirrorWrap is cross-version ROM like
      the other un-restored techniques; fork-fidelity / frame-feasibility stays
      playtest-pending → untested-on-us10. (No us10-different wrap delta exists.)

