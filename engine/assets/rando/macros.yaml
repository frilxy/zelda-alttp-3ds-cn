  # ===========================================================================
  # hasBottle — N-bottle test (counts only bottles, not bottle contents
  # individually — multiple-bottle predicates count distinct bottle items).
  # ===========================================================================
  - name: HasBottle
    parameters: [at_least]
    body: "HAS_ANY_COUNT([BottleEmpty, BottleWithFairy, BottleWithBee, BottleWithGoodBee, BottleWithRedPotion, BottleWithGreenPotion, BottleWithBluePotion], at_least)"
    source: "app/Support/ItemCollection.php:687-690"
    notes: |
      ALTTPR's hasBottle calls bottleCount() which filters
      `Item\Bottle` instances. Our bottle taxonomy in item_registry.yaml
      (ids 43-49) covers all bottle states; HAS_ANY_COUNT sums them.
      Note: ALTTPR also references a bare `Bottle` item name in hasABottle
      (line 716) — that's the "Bottle" base-class name in the upstream
      Item enum, which we model as `BottleEmpty`.

  # ===========================================================================
  # bottleCount — counter helper, returns int. Emit as macro for citation;
  # predicate bodies should use HAS_ANY_COUNT([bottles...], N) directly.
  # ===========================================================================
  - name: BottleCount
    parameters: [at_least]
    body: "HAS_ANY_COUNT([BottleEmpty, BottleWithFairy, BottleWithBee, BottleWithGoodBee, BottleWithRedPotion, BottleWithGreenPotion, BottleWithBluePotion], at_least)"
    source: "app/Support/ItemCollection.php:697-702"
    notes: |
      bottleCount() returns an integer; our DSL has no integer-returning
      macros (only boolean predicates). The provenance-faithful form is
      "have at_least N bottles", identical to HasBottle. Predicate bodies
      should call HasBottle(N) instead.

  # ===========================================================================
  # Phase B Slice 4 §56 — trick-aware named macros.
  #
  # Each macro pairs a trick id from `op_registry.yaml:tricks:` with the
  # vanilla item prerequisite for that trick (e.g., boots-clip requires
  # boots in the inventory in addition to the trick bit being set).
  # Settings axes:
  #   - settings.tricks (uint8 LE, 1 bit per trick)
  #   - settings.logic  (NoGlitches=0..NoLogic=4) — glitch level
  #
  # Default settings (tricks=0, logic=no_glitches) cause every macro
  # below to evaluate FALSE, preserving Phase A corpus byte-identity.
  # ===========================================================================
  - name: CanBootsClip
    parameters: []
    body: "(OP_TRICK(boots_clip) OR OP_GLITCH_LEVEL_AT_LEAST(overworld_glitches)) AND HAS_ITEM(Boots)"
    source: "config/logic.php:9,18,28 (canBootsClip @ OWG/HMG/MG) + region `config('canBootsClip') && has('PegasusBoots')`"
    notes: |
      Mirrors ALTTPR's `$world->config('canBootsClip', false) &&
      $items->has('PegasusBoots')`. canBootsClip is an OverworldGlitches-group
      flag — config/logic.php enables it at OverworldGlitches (line 9), HybridMG
      (18), AND MajorGlitches (28) — so the glitch-level disjunct is
      OP_GLITCH_LEVEL_AT_LEAST(overworld_glitches) (true at logic>=1). The boots
      prereq applies to BOTH the trick and the glitch-level path.

      Phase D (add-rando-major-glitch §5) folds the glitch level into the macro
      (was trick-bit-only). The fork's trick BIT remains as an independent
      fine-grained opt-in (a fork extension over ALTTPR, which drives the
      technique purely from the logic level). Default (logic=0, tricks=0)
      collapses both disjuncts to false → the trick-only form → digest-identical;
      verified on the NoGlitches + b-tricks-* corpus entries (unchanged).
      OWG/MG seeds move (faithful — ALTTPR enables boots-clip at those tiers).

  - name: CanFakeFlippers
    parameters: []
    body: "OP_TRICK(fake_flippers) OR OP_GLITCH_LEVEL_AT_LEAST(overworld_glitches)"
    source: "config/logic.php:7,16,26 (canFakeFlipper @ OWG/HMG/MG)"
    notes: |
      ALTTPR `config('canFakeFlipper', false)` — no item prereq (fake-flippers
      needs only the technique). canFakeFlipper is an OWG-group flag
      (config/logic.php enables it at OverworldGlitches line 7, HybridMG 16,
      MajorGlitches 26), so the level disjunct is
      OP_GLITCH_LEVEL_AT_LEAST(overworld_glitches). Phase D folds the level in;
      the trick bit stays an independent fork opt-in. Callers compose
      `HAS_ITEM(Flippers) OR CanFakeFlippers()`. Default (logic=0, tricks=0) →
      false → digest-identical.

  - name: CanDarkRoomNav
    parameters: []
    body: "OP_TRICK(dark_room_nav)"
    source: "ALTTPR `item.require.Lamp=0` config-flag equivalent"
    notes: |
      Mirrors ALTTPR's `item.require.Lamp=0` config — when the trick is
      on, dark-room predicates that gate on Lamp can be bypassed.
      Usage: `HAS_ITEM(Lamp) OR CanDarkRoomNav()`.

