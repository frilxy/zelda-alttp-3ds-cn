# ---------------------------------------------------------------------------
# Glitch levels (§12.6.2). Surfaced as registry entries so the same
# `rom_version_status` field + the spoiler `unverified_tricks_enabled` warning
# apply to OP_GLITCH_LEVEL_AT_LEAST tiers the same way they apply to tricks.
# `level` is the settings.logic value (matches rando_settings.h `logic` enum +
# the codegen GLITCH_LEVELS map). NoGlitches (0) is the default tier and is
# NEVER unverified, so it is intentionally absent.
#
# WHY the levels stay `untested-on-us10` (grounded, JP-vs-US ROM sweep
# 2026-06-09, _jpglitch_spike/romdiff.py — see
# openspec/changes/add-rando-major-glitch/TEN_TECHNIQUES.md): of the 10
# glitch techniques the JP-glitch restoration did NOT make performable
# (everything except canFakeFlipper + canSuperSpeed), a per-technique
# careful_diff confirmed NONE is JP-1.0-exclusive — every enabling collision/
# movement/bunny/swim/dungeon routine is byte-identical JP↔US (relocation only),
# and the fork faithfully reproduces the substrate (sub-tile corner-collision
# tables, subpixel velocity-before-collision ordering, the bunny state machine).
# So they are CROSS-VERSION ROM, but their fork-reimpl frame-feasibility (esp.
# the 1-frame clips canOneFrameClipOW/UW) is unconfirmed → honest
# `untested-on-us10`, NOT `cross-version` (that bar needs a positive playtest)
# and NOT `jp10-only`. (canMirrorWrap + canTransitionWrapped are NOT
# us10-different — the mirror-warp / screen-entry DESTINATION + position +
# camera math is BYTE-IDENTICAL JP↔US; the only delta is the destination
# screen's overworld MUSIC selection [$7F5B00 = overworld_music[] WRAM, not a
# dest table; writes differ at $12C/$12D], which has no reachability effect.
# So those two are cross-version ROM like the rest → untested-on-us10. See
# their macros.yaml notes.)
# ---------------------------------------------------------------------------
glitch_levels:
  - level: 1
    id: overworld_glitches
    name: "Overworld Glitches"
    description: |
      OWG tier. ALTTPR OverworldGlitches flag set (config/logic.php:5-13):
      canSuperBunny, canFakeFlipper, canSuperSpeed, canBootsClip, canMirrorClip,
      canWaterWalk, canDungeonRevive. Phase D (add-rando-major-glitch §5) folded
      the OWG-group level into the CanBootsClip + CanFakeFlippers macros, so
      `logic=OverworldGlitches` is NO LONGER a placement no-op — boots-clip and
      fake-flipper sites now route at tier 1. PARTIAL: the remaining OWG-group
      techniques (canSuperSpeed/canSuperBunny/canMirrorClip/canWaterWalk/
      canDungeonRevive) still ride the raw OP_GLITCH_LEVEL_AT_LEAST(major_glitches)
      threshold sites, so they stay closed at OWG (the SAFE direction — never opens
      too early). Reclassifying those raw sites to tier 1 is frontier F1 (per-site
      technique ID). US-1.0 unverified regardless — see design.md + tasks F1/F4.
      # F4 honesty: of the 7 OWG techniques, exactly TWO are restored+performable
      # on US 1.0 — canFakeFlipper (flipped verified-us10 as the fake-flippers
      # trick) and canSuperSpeed (Superspeed glitch, owner-confirmed). The level
      # STAYS untested because the other 5 (canSuperBunny/canBootsClip/
      # canMirrorClip/canWaterWalk/canDungeonRevive) are NOT restored by
      # add-jp-glitch-restoration and are US-1.0-unperformed-on-this-fork; flipping
      # the level would falsely suppress the unverified warning for seeds routing
      # through them. canSuperSpeed has no independent trick bit, so it cannot be
      # flipped in isolation — it rides this level's status. See the
      # OVERNIGHT_REPORT performability ledger.
    rom_version_status: untested-on-us10
  - level: 2
    id: major_glitches
    name: "Major Glitches"
    description: |
      MG tier — the MOST permissive (config/logic.php:24-37: OWG-group +
      canMirrorWrap + canOWYBA + canOneFrameClipOW + canOneFrameClipUW +
      canTransitionWrapped). Phase D §5: canOWYBA (MG-exclusive) folded into
      CanPearlBypass via `>=major_glitches AND NOT >=hybrid_major_glitches`, so it
      opens at MG but NOT HMG. ~40 raw OP_GLITCH_LEVEL_AT_LEAST(major_glitches)
      threshold sites (canOneFrameClipOW/UW etc.) remain — frontier F1.
    rom_version_status: untested-on-us10
  - level: 3
    id: hybrid_major_glitches
    name: "Hybrid Major Glitches"
    description: |
      HMG tier (config/logic.php:14-23): OWG-group + canOneFrameClipUW. A
      technique SUBSET of MajorGlitches (HMG ⊂ MG), so there are ZERO
      HMG-exclusive locations. Opened for user input in Phase D
      (add-rando-major-glitch §2). canOneFrameClipUW rides
      OP_GLITCH_LEVEL_AT_LEAST(major_glitches) (>=2, true at MG+HMG); the
      MG-exclusive techniques (canOWYBA folded into CanPearlBypass, plus the raw
      canOneFrameClipOW/canMirrorWrap/canTransitionWrapped threshold sites) are
      correctly closed at HMG only where they use the MG-exclusive form — the raw
      threshold sites still over-reach at HMG (frontier F1).
    rom_version_status: untested-on-us10
  - level: 4
    id: no_logic
    name: "No Logic"
    description: |
      NoLogic tier — NOT in config/logic.php (no technique flags). Opened for
      user input in Phase D (§2). The predicate VM short-circuits the reachability
      eval (rando_logic.c Predicate_EvalCtx, placement_context==0) so every
      location is reachable and goal-completability passes vacuously; can_place
      confinement stays live. Carries the dedicated no_logic_seed spoiler warning.
    rom_version_status: untested-on-us10
