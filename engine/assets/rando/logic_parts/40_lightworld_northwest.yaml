# 40_lightworld_northwest.yaml — Light World North West region
#
# Mechanically translated from ALTTPR PHP closures at
# `../alttp_vt_randomizer/app/Region/Standard/LightWorld/NorthWest.php`
# (MIT, verified per CLAUDE.md "Claim-grounding discipline").
#
# Phase A translation discipline (audit.md §0.10.2):
#   - All glitch/trick branches (canBootsClip, canOneFrameClipOW,
#     canSuperSpeed, canMirrorClip, canMirrorWrap, canFakeFlipper, canOWYBA,
#     canBunnyRevive, canBunnySurf, canSuperBunny, canWaterWalk,
#     canTransitionWrapped) are pinned false → branches drop.
#   - `itemPlacement === 'basic'` and `itemPlacement === 'advanced'` branches
#     are dropped per audit §0.10.2 (Phase A pins itemPlacement=basic
#     consistently; the `!== 'basic'` test is FALSE in Phase A, collapsing
#     those disjuncts).
#   - PHP `PegasusBoots` → our `Boots`.
#   - PHP `Powder` → our `MagicPowder`.
#   - PHP `PendantOfCourage/Wisdom/Power` → `OP_HAS_PRIZE(Prize_GreenPendant/
#     Prize_BluePendant/Prize_RedPendant)` (the engine resolves which dungeon
#     currently holds each pendant via prize-shuffle).
#   - The `can_enter` closure (php:141-143) requires RescueZelda → modeled
#     as the edge from LinksHouse to this region.

format_version: 1

regions:
  - id: LightWorld_NorthWest
    name: "Light World - North West"
    source: "app/Region/Standard/LightWorld/NorthWest.php:14-147"

edges:
  # NorthWest entry — `can_enter` (php:141-143) only requires RescueZelda.
  # LinksHouse already provides the world-state gate (Standard requires
  # RescuedZelda before leaving the sewers), so the edge is TRUE() once
  # the LinksHouse->LightWorld_NorthEast edge has resolved RescuedZelda
  # in Standard mode; in Open/Retro the source's can_traverse handles it.
  - from: LightWorld_NorthEast
    to: LightWorld_NorthWest
    predicate: "TRUE()"
    source: "app/Region/Standard/LightWorld/NorthWest.php:141-143 (can_enter = RescueZelda)"

locations:
  # `Master Sword Pedestal` (php:86-91): pendant trifecta.
  # The `itemPlacement!=='basic' || has(BookOfMudora)` branch collapses to
  # TRUE() in Phase A (`itemPlacement=basic` pinned → `!== 'basic'` false →
  # require BookOfMudora). PHP `PendantOfCourage/Wisdom/Power` map to
  # OP_HAS_PRIZE on the green/blue/red pendant respectively.
  - id: "Master Sword Pedestal"
    region: LightWorld_NorthWest
    can_reach: "HAS_ITEM(BookOfMudora) AND OP_HAS_PRIZE(Prize_RedPendant) AND OP_HAS_PRIZE(Prize_BluePendant) AND OP_HAS_PRIZE(Prize_GreenPendant)"
    source: "app/Region/Standard/LightWorld/NorthWest.php:86-91"

  # `King's Tomb` (php:93-102):
  #   Boots AND (canBootsClip || canLiftDarkRocks || canOneFrameClipOW
  #              || (canSuperSpeed && spin) || (MagicMirror && DW NW && ...))
  # Phase A retained `Boots AND CanLiftDarkRocks`. Phase B Slice 4 §7
  # surfaces boots-clip (note: CanBootsClip already AND's HAS_ITEM(Boots)
  # internally, but the outer `HAS_ITEM(Boots)` requirement is preserved
  # so the predicate's existing structure is unchanged when tricks=0) and
  # the OWG bypass. canSuperSpeed lacks a macro.
  - id: "King's Tomb"
    region: LightWorld_NorthWest
    can_reach: "HAS_ITEM(Boots) AND (CanLiftDarkRocks() OR CanBootsClip() OR CanOneFrameClipOW() OR (CanSuperSpeed() AND CanSpinSpeed()))"
    source: "app/Region/Standard/LightWorld/NorthWest.php:93-102"

