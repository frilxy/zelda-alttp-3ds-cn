# 43_darkworld.yaml — All Dark World overworld regions consolidated
#
# Mechanically translated from ALTTPR PHP closures at:
#   - `../alttp_vt_randomizer/app/Region/Standard/DarkWorld/Mire.php`
#   - `../alttp_vt_randomizer/app/Region/Standard/DarkWorld/NorthEast.php`
#   - `../alttp_vt_randomizer/app/Region/Standard/DarkWorld/NorthWest.php`
#   - `../alttp_vt_randomizer/app/Region/Standard/DarkWorld/South.php`
#   - `../alttp_vt_randomizer/app/Region/Standard/DarkWorld/DeathMountain/West.php`
#   - `../alttp_vt_randomizer/app/Region/Standard/DarkWorld/DeathMountain/East.php`
# (MIT, verified per CLAUDE.md "Claim-grounding discipline").
#
# Phase A translation discipline (audit.md §0.10.2):
#   - All glitch/trick branches (canBootsClip, canOneFrameClipOW,
#     canSuperSpeed, canMirrorClip, canMirrorWrap, canFakeFlipper, canOWYBA,
#     canBunnyRevive, canBunnySurf, canSuperBunny, canWaterWalk) drop.
#   - swordless-mode branch drops.
#   - `itemPlacement === 'basic'` is pinned in Phase A → `!== 'basic'`
#     branches drop.
#   - `region.swordsInPool` defaults true (Phase A pins true) so the
#     Pyramid Fairy Left/Right slots exist.
#   - `region.requireBetterBow` / `region.requireBetterSword` default false.
#   - Goal-specific guards on the Ganon location use Phase A goal=fast_ganon
#     which means DefeatAgahnim2 prerequisite drops (`in_array(goal,
#     ['fast_ganon','ganonhunt']) → true`).
#   - PHP `Crystal5` / `Crystal6` (the virtual items granted on clearing
#     the dungeons holding those prizes) → `OP_HAS_PRIZE(Prize_Crystal5)` /
#     `OP_HAS_PRIZE(Prize_Crystal6)`.
#   - PHP `PendantOfCourage/Wisdom/Power` →
#     `OP_HAS_PRIZE(Prize_GreenPendant/Prize_BluePendant/Prize_RedPendant)`.
#   - PHP `PegasusBoots` → `Boots`. PHP `Bottle` → `HasABottle()`.
#   - The dark-world "bunny check" `(MoonPearl OR canOWYBA+bottle OR
#     canBunnyRevive)` collapses to `HAS_ITEM(MoonPearl)` in Phase A.

format_version: 1

regions:
  - id: DarkWorld_Mire
    name: "Dark World - Mire"
    source: "app/Region/Standard/DarkWorld/Mire.php:14-100"

  - id: DarkWorld_NorthEast
    name: "Dark World - North East"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:14-238"

  - id: DarkWorld_NorthWest
    name: "Dark World - North West"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:14-167"

  - id: DarkWorld_South
    name: "Dark World - South"
    source: "app/Region/Standard/DarkWorld/South.php:14-160"

  - id: DarkWorld_DeathMountain_West
    name: "Dark World - Death Mountain West"
    source: "app/Region/Standard/DarkWorld/DeathMountain/West.php:14-75"

  - id: DarkWorld_DeathMountain_East
    name: "Dark World - Death Mountain East"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:14-115"

edges:
  # ----- DarkWorld_Mire entry (Mire.php:86-96) --------------------------------
  # Phase A surviving branches: canLiftDarkRocks AND canFly (flute), OR
  # mirror-wrap+south-DW (drops). The only no-glitches path is the heavy
  # gloves + flute fly to mire flute spot.
  - from: LightWorld_NorthEast
    to: DarkWorld_Mire
    predicate: "CanLiftDarkRocks() AND CanFly(world)"
    source: "app/Region/Standard/DarkWorld/Mire.php:86-96 (can_enter)"

  # ----- DarkWorld_NorthEast entry (NorthEast.php:156-184) --------------------
  # Phase A surviving branches collapse aggressively. Drop everything that
  # uses canBootsClip / canMirrorClip / canMirrorWrap / canBunnyRevive /
  # canSuperSpeed / canFakeFlipper / canOWYBA / canBunnySurf. What survives:
  #   * DefeatAgahnim (post-Aga warp to Pyramid)
  #   * Hammer + canLiftRocks + MoonPearl (light-world hammer-bridge from
  #     east light-world, mirror to dark)
  #   * canLiftDarkRocks + MoonPearl + (Hammer OR Flippers)
  - from: LightWorld_NorthEast
    to: DarkWorld_NorthEast
    predicate: "HAS_ITEM(DefeatAgahnim) OR (HAS_ITEM(Hammer) AND CanLiftRocks() AND HAS_ITEM(MoonPearl)) OR (CanLiftDarkRocks() AND HAS_ITEM(MoonPearl) AND (HAS_ITEM(Hammer) OR HAS_ITEM(Flippers)))"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:156-184 (can_enter)"

  # ----- DarkWorld_NorthWest entry (NorthWest.php:143-164) --------------------
  # Surviving branches: MoonPearl AND (
  #   (DarkWorld_NorthEast reachable AND (Hookshot AND (canLiftRocks OR
  #     Hammer OR Flippers))) OR
  #   (Hammer AND canLiftRocks) OR
  #   canLiftDarkRocks
  # )
  - from: LightWorld_NorthEast
    to: DarkWorld_NorthWest
    predicate: "HAS_ITEM(MoonPearl) AND ((OP_REGION_REACHABLE(DarkWorld_NorthEast) AND HAS_ITEM(Hookshot) AND (CanLiftRocks() OR HAS_ITEM(Hammer) OR HAS_ITEM(Flippers))) OR (HAS_ITEM(Hammer) AND CanLiftRocks()) OR CanLiftDarkRocks())"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:143-164 (can_enter)"

  # ----- DarkWorld_South entry (South.php:147-156) ----------------------------
  # Surviving branches: MoonPearl AND DarkWorld_NorthEast-reachable AND
  # Hammer, OR DarkWorld_NorthWest reachable (no extra requirements once
  # NW is reached - the south is hammer-bridge-adjacent on the dark side).
  - from: LightWorld_NorthEast
    to: DarkWorld_South
    predicate: "(HAS_ITEM(MoonPearl) AND OP_REGION_REACHABLE(DarkWorld_NorthEast) AND HAS_ITEM(Hammer)) OR OP_REGION_REACHABLE(DarkWorld_NorthWest)"
    source: "app/Region/Standard/DarkWorld/South.php:147-156 (can_enter)"

  # ----- DarkWorld_DeathMountain_West entry (West.php:68-71) ------------------
  # Surviving branch: RescueZelda AND West_Death_Mountain reachable.
  # The light-world DM entry edge already gates RescueZelda.
  - from: LightWorld_DeathMountain_West
    to: DarkWorld_DeathMountain_West
    predicate: "TRUE()"
    source: "app/Region/Standard/DarkWorld/DeathMountain/West.php:68-71 (can_enter)"

  # ----- DarkWorld_DeathMountain_East entry (East.php:100-111) ----------------
  # Surviving branches: canLiftDarkRocks AND East_Death_Mountain reachable
  # (mirror-trick branches drop).
  - from: LightWorld_DeathMountain_East
    to: DarkWorld_DeathMountain_East
    predicate: "CanLiftDarkRocks()"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:100-111 (can_enter)"

locations:
  # ===========================================================================
  # Dark World — Mire (Mire.php:14-100)
  # ===========================================================================

  # `Mire Shed - Left` (Mire.php:66-74):
  #   MoonPearl
  #   OR (canOWYBA AND hasABottle AND
  #        (canOneFrameClipOW OR hasBottle(2)
  #         OR (MagicMirror AND BugCatchingNet AND canBunnyRevive)
  #         OR (canBootsClip AND PegasusBoots)))
  #   OR (canSuperBunny AND MagicMirror)
  # Slice 4 §7 surfaces the bunny-glitch pearl-bypass branch with its full
  # 4-way inner trigger. Defaults (tricks=0, logic=NoGlitches) collapse
  # the new disjunct to FALSE; predicate reduces to HAS_ITEM(MoonPearl).
  # canSuperBunny+MagicMirror branch stays dropped — no CanSuperBunny macro.
  - id: "Mire Shed - Left"
    region: DarkWorld_Mire
    can_reach: "HAS_ITEM(MoonPearl) OR (CanSuperBunny() AND HAS_ITEM(MagicMirror)) OR (CanPearlBypass() AND (CanOneFrameClipOW() OR HasBottle(2) OR (HAS_ITEM(MagicMirror) AND HAS_ITEM(BugCatchingNet) AND CanBunnyRevival(world)) OR CanBootsClip()))"
    source: "app/Region/Standard/DarkWorld/Mire.php:66-74"

  # `Mire Shed - Right` (Mire.php:76-84): identical shape to Left.
  - id: "Mire Shed - Right"
    region: DarkWorld_Mire
    can_reach: "HAS_ITEM(MoonPearl) OR (CanSuperBunny() AND HAS_ITEM(MagicMirror)) OR (CanPearlBypass() AND (CanOneFrameClipOW() OR HasBottle(2) OR (HAS_ITEM(MagicMirror) AND HAS_ITEM(BugCatchingNet) AND CanBunnyRevival(world)) OR CanBootsClip()))"
    source: "app/Region/Standard/DarkWorld/Mire.php:76-84"

  # ===========================================================================
  # Dark World — North East (NorthEast.php:14-238)
  # ===========================================================================

  # `Catfish` (NorthEast.php:95-101):
  #   (canBunnyRevive OR MoonPearl OR (canOWYBA AND hasABottle))
  #   AND (canOneFrameClipOW OR (canBootsClip AND Boots) OR canLiftRocks)
  # Slice 4 §7 surfaces all three pearl-gate alternatives via
  # CanBunnyRevival + CanPearlBypass, and surfaces the canOneFrameClipOW
  # movement disjunct via OP_GLITCH_LEVEL_AT_LEAST(major_glitches).
  # CanBootsClip already encapsulates the bootsClip+Boots conjunction.
  # Defaults (tricks=0, logic=NoGlitches) collapse every new disjunct to
  # FALSE → predicate reduces to Phase A's `MoonPearl AND CanLiftRocks()`.
  - id: "Catfish"
    region: DarkWorld_NorthEast
    can_reach: "(HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)) AND (CanLiftRocks() OR CanBootsClip() OR CanOneFrameClipOW())"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:95-101"

  # `Pyramid` (php:33) — no setRequirements; default TRUE (reachability
  # gated by region entry).
  - id: "Pyramid"
    region: DarkWorld_NorthEast
    can_reach: "TRUE()"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:33"

  # Pyramid Fairy. ALTTPR delivers this pond as TWO chests (Left/Right); the
  # Sword/Bow Trade slots (the vanilla throw-in upgrade) were RETIRED — see
  # change add-rando-fairy-chest-model. The runtime grants Left/Right on contact
  # (Sprite_WishPond3). Both are reach-only (NO weapon requirement) — that is
  # the whole point: the chest model needs no sword/bow. The DW/Crystal gate
  # below mirrors the PHP; the canMirrorClip outer subtree stays dropped (no
  # CanMirrorClip / CanSuperSpeed / CanSpinSpeed macros in macros.yaml — Phase B
  # reservation; CanPearlBypass() surfaces canOWYBA+hasABottle).
  #
  # `Pyramid Fairy - Left` (php:131-141): Crystal gate only (no weapon).
  - id: "Pyramid Fairy - Left"
    region: DarkWorld_NorthEast
    can_reach: "OP_HAS_PRIZE(Prize_Crystal5) AND OP_HAS_PRIZE(Prize_Crystal6) AND OP_REGION_REACHABLE(DarkWorld_South) AND ((HAS_ITEM(MoonPearl) AND HAS_ITEM(Hammer)) OR CanPearlBypass() OR (HAS_ITEM(MagicMirror) AND HAS_ITEM(DefeatAgahnim)))"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:131-141"

  # `Pyramid Fairy - Right` (php:143-153): same as Left.
  - id: "Pyramid Fairy - Right"
    region: DarkWorld_NorthEast
    can_reach: "OP_HAS_PRIZE(Prize_Crystal5) AND OP_HAS_PRIZE(Prize_Crystal6) AND OP_REGION_REACHABLE(DarkWorld_South) AND ((HAS_ITEM(MoonPearl) AND HAS_ITEM(Hammer)) OR CanPearlBypass() OR (HAS_ITEM(MagicMirror) AND HAS_ITEM(DefeatAgahnim)))"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:143-153"

  # `Ganon` (NorthEast.php:186-234): the prize-event for clearing the game.
  # Phase A goal=fast_ganon: the dungeons/ganonhunt/crystals guards drop
  # (fast_ganon needs no DefeatAgahnim2 nor crystals.ganon count).
  # Surviving body: MoonPearl AND silvers-clause AND weapon-clause AND lamp-clause.
  # Weapon clause (NorthEast.php:228-233):
  #   (swordless AND Hammer AND (Lamp OR FireRod+magic1))
  #   OR (hasSword(2) AND (Lamp OR FireRod+magic3))
  #   OR (hasSword(3) AND (Lamp OR FireRod+magic2))
  # Silvers clause (NorthEast.php:227): `!requireBetterBow || canShootArrows(2)`.
  # `requireBetterBow` is set true ONLY in swordless (World.php:269-273) → silvers
  # are required iff swordless. Phase A authoring shorthand uses CanExtendMagic
  # (world, 1) for the FireRod magic budget (more permissive than ALTTPR's 2/3).
  # §4 swordless: weapon clause becomes `swordless ? (Hammer AND CanShootSilvers())
  # : HasSword2()`. Under the default (randomized) OP_MODEWEAPONS_EQ(swordless) is
  # false → the NOT-swordless arm reduces to bare HasSword2(), so default seeds are
  # byte-identical. Runtime: under swordless the Hammer damages Ganon (see
  # Rando_IsSwordlessActive in misc/sprite code); silvers still finish him.
  # Slice 4 §7: NorthEast.php pearl gate includes a canOWYBA+bottle alternative;
  # PHP for Ganon has NO canBunnyRevive disjunct on the pearl gate.
  - id: "Ganon"
    region: DarkWorld_NorthEast
    can_reach: "(HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND ((OP_MODEWEAPONS_EQ(swordless) AND HAS_ITEM(Hammer) AND CanShootSilvers()) OR ((NOT OP_MODEWEAPONS_EQ(swordless)) AND HasSword2())) AND (HAS_ITEM(Lamp) OR (HAS_ITEM(FireRod) AND CanExtendMagic(world, 1))) AND NeedsBossSoul(Soul_Ganon)"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:186-234 + World.php:269-273 (requireBetterBow)"

  # ===========================================================================
  # Dark World — North West (NorthWest.php:14-167)
  # ===========================================================================

  # `Brewery` (NorthWest.php:78-82):
  #   canBombThings AND (MoonPearl OR (canOWYBA AND hasABottle) OR canBunnyRevive)
  # Slice 4 §7 surfaces the full pearl-OR triple.
  - id: "Brewery"
    region: DarkWorld_NorthWest
    can_reach: "CanBombThings() AND (HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world))"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:78-82"

  # `C-Shaped House` (NorthWest.php:84-88):
  #   MoonPearl OR canSuperBunny OR (canOWYBA AND hasABottle) OR canBunnyRevive
  # canSuperBunny stays dropped — no macro.
  - id: "C-Shaped House"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:84-88"

  # `Chest Game` (NorthWest.php:90-94): identical to C-Shaped House.
  - id: "Chest Game"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:90-94"

  # `Hammer Pegs` (NorthWest.php:96-106):
  #   Hammer AND
  #   (MoonPearl OR (canOWYBA AND hasABottle) OR canBunnyRevive) AND
  #   (canLiftDarkRocks OR (MagicMirror AND canMirrorWrap)
  #    OR ((canFakeFlipper OR Flippers)
  #         AND (canOneFrameClipOW OR (canBootsClip AND PegasusBoots)
  #              OR (canSuperSpeed AND canSpinSpeed))))
  # Slice 4 §7: surfaces pearl-OR triple + the canFakeFlipper/Flippers
  # alt-traverse path. canMirrorWrap+mirror and canSuperSpeed+canSpinSpeed
  # disjuncts stay dropped — no macros.
  - id: "Hammer Pegs"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(Hammer) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)) AND (CanLiftDarkRocks() OR ((CanFakeFlippers() OR HAS_ITEM(Flippers)) AND (CanOneFrameClipOW() OR CanBootsClip())))"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:96-106"

  # `Bumper Cave` (NorthWest.php:108-116):
  #   canOneFrameClipOW
  #   OR ((MoonPearl OR (canOWYBA AND hasABottle) OR canBunnyRevive)
  #        AND ((canBootsClip AND PegasusBoots)
  #             OR ((itemPlacement!=='basic' OR Hookshot) AND canLiftRocks AND Cape)))
  # Phase A: itemPlacement axis dropped per audit §0.10.2; we conservatively
  # retain Hookshot as the gate for the non-bootsClip path (basic-mode shape).
  # Phase B Slice 4 §7: surfaces canOneFrameClipOW (MajorGlitches), the
  # full pearl-gate OR-chain (MoonPearl OR CanPearlBypass OR CanBunnyRevival),
  # AND the canBootsClip+Boots inner disjunct (previously dropped).
  # Defaults (logic=NoGlitches, tricks=0) collapse the new branches to FALSE.
  - id: "Bumper Cave"
    region: DarkWorld_NorthWest
    can_reach: "CanOneFrameClipOW() OR ((HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)) AND (CanBootsClip() OR (HAS_ITEM(Hookshot) AND CanLiftRocks() AND HAS_ITEM(Cape))))"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:108-116"

  # `Blacksmith` (NorthWest.php:118-128): (itemPlacement!=='basic' ||
  # MagicMirror) → MagicMirror in Phase A AND MoonPearl AND canLiftDarkRocks.
  - id: "Blacksmith"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(MagicMirror) AND HAS_ITEM(MoonPearl) AND CanLiftDarkRocks()"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:118-128"

  # `Purple Chest` (NorthWest.php:130-141): Blacksmith reachable AND
  # MoonPearl AND canLiftDarkRocks. Mirror-wrap and Flippers/glitch
  # branches drop.
  - id: "Purple Chest"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(MagicMirror) AND HAS_ITEM(MoonPearl) AND CanLiftDarkRocks()"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:130-141"

  # ===========================================================================
  # Dark World — South (South.php:14-160)
  # ===========================================================================

  # `Hype Cave - Top/Middle Right/Middle Left/Bottom/NPC` (South.php:65-93):
  # all five chests share the predicate
  #   MoonPearl OR (canOWYBA AND hasABottle) OR canBunnyRevive
  # Slice 4 §7 surfaces the full pearl-OR triple.
  - id: "Hype Cave - Top"
    region: DarkWorld_South
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/South.php:65-69"

  - id: "Hype Cave - Middle Right"
    region: DarkWorld_South
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/South.php:71-75"

  - id: "Hype Cave - Middle Left"
    region: DarkWorld_South
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/South.php:77-81"

  - id: "Hype Cave - Bottom"
    region: DarkWorld_South
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/South.php:83-87"

  - id: "Hype Cave - NPC"
    region: DarkWorld_South
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/South.php:89-93"

  # `Stumpy` (South.php:95-100):
  #   MoonPearl OR (canOWYBA AND hasABottle) OR canBunnyRevive
  #   OR (MagicMirror AND canMirrorWrap)
  # Slice 4 §7 surfaces the pearl-OR triple. canMirrorWrap+mirror stays
  # dropped — no CanMirrorWrap macro.
  - id: "Stumpy"
    region: DarkWorld_South
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/South.php:95-100"

  # `Digging Game` (South.php:102-106):
  #   MoonPearl OR (canOWYBA AND hasABottle) OR canBunnyRevive
  - id: "Digging Game"
    region: DarkWorld_South
    can_reach: "HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)"
    source: "app/Region/Standard/DarkWorld/South.php:102-106"

  # ===========================================================================
  # Dark World — Death Mountain West (DeathMountain/West.php:14-75)
  # ===========================================================================

  # `Spike Cave` (West.php:55-66): MoonPearl AND Hammer AND canLiftRocks
  # AND (Cape AND canExtendMagic OR CaneOfByrna). canExtendMagic with the
  # default `bars=2` form expands to the standard CanExtendMagic(world, 1).
  - id: "Spike Cave"
    region: DarkWorld_DeathMountain_West
    can_reach: "HAS_ITEM(MoonPearl) AND HAS_ITEM(Hammer) AND CanLiftRocks() AND ((HAS_ITEM(Cape) AND CanExtendMagic(world, 1)) OR HAS_ITEM(CaneOfByrna))"
    source: "app/Region/Standard/DarkWorld/DeathMountain/West.php:55-66"

  # ===========================================================================
  # Dark World — Death Mountain East (DeathMountain/East.php:14-115)
  # ===========================================================================

  # `Superbunny Cave - Top` (East.php:58-63): MoonPearl (canSuperBunny and
  # canOWYBA branches drop in Phase A). Phase B Slice 4 §7: under
  # `tricks=pearl-bypass`, the canOWYBA+bottle alternative un-pins
  # (CanPearlBypass = `OP_TRICK(pearl_bypass) AND HasABottle()`).
  # Default `tricks=0` collapses CanPearlBypass to FALSE → Phase A shape.
  # PHP shape (East.php:58-70):
  #   canSuperBunny OR MoonPearl
  #   OR (canOWYBA AND hasABottle AND (canBootsClip+Boots OR canOneFrameClipOW))
  # The previous YAML had `MoonPearl OR CanPearlBypass()` which is too
  # permissive — under tricks=pearl-bypass alone, PHP STILL requires
  # boots-clip OR clipOW co-trick. Tighten to mirror PHP's inner AND.
  # canSuperBunny still dropped (no macro).
  - id: "Superbunny Cave - Top"
    region: DarkWorld_DeathMountain_East
    can_reach: "HAS_ITEM(MoonPearl) OR CanSuperBunny() OR (CanPearlBypass() AND (CanBootsClip() OR CanOneFrameClipOW()))"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:58-63"

  - id: "Superbunny Cave - Bottom"
    region: DarkWorld_DeathMountain_East
    can_reach: "HAS_ITEM(MoonPearl) OR CanSuperBunny() OR (CanPearlBypass() AND (CanBootsClip() OR CanOneFrameClipOW()))"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:65-70"

  # PHP shape (East.php:72-91 for the four Hookshot Cave chests):
  #   Hookshot AND
  #   (MoonPearl OR (canOWYBA AND hasABottle)) AND
  #   (canLiftRocks OR canOneFrameClipOW OR (canBootsClip AND PegasusBoots))
  # Slice 4 §7 surfaces the pearl-OR alternative (CanPearlBypass) AND
  # the canOneFrameClipOW movement disjunct. East.php pearl gate omits
  # canBunnyRevive — distinguish from other DW sites.
  - id: "Hookshot Cave - Top Right"
    region: DarkWorld_DeathMountain_East
    can_reach: "HAS_ITEM(Hookshot) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanLiftRocks() OR CanBootsClip() OR CanOneFrameClipOW())"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:72-77"

  - id: "Hookshot Cave - Top Left"
    region: DarkWorld_DeathMountain_East
    can_reach: "HAS_ITEM(Hookshot) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanLiftRocks() OR CanBootsClip() OR CanOneFrameClipOW())"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:79-84"

  - id: "Hookshot Cave - Bottom Left"
    region: DarkWorld_DeathMountain_East
    can_reach: "HAS_ITEM(Hookshot) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanLiftRocks() OR CanBootsClip() OR CanOneFrameClipOW())"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:86-91"

  # `Hookshot Cave - Bottom Right` (East.php:93-98): Hookshot OR (Boots in
  # non-basic placement, which drops in Phase A); plus the MoonPearl +
  # canLiftRocks gate with the same trick disjuncts as the other three.
  - id: "Hookshot Cave - Bottom Right"
    region: DarkWorld_DeathMountain_East
    can_reach: "HAS_ITEM(Hookshot) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanLiftRocks() OR CanBootsClip() OR CanOneFrameClipOW())"
    source: "app/Region/Standard/DarkWorld/DeathMountain/East.php:93-98"

macros: []
