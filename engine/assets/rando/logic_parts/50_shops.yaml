  # --- Dark World Village of Outcasts (DarkWorld/NorthWest.php:44) ---
  # Callback (NorthWest.php:72-76): Hammer AND (MoonPearl OR (canOWYBA AND
  # hasABottle) OR (canBunnyRevive AND canBunnyRevive)) — same pearl-OR
  # triple as Brewery (43_darkworld.yaml).
  - id: "Dark World Village of Outcasts - 0"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(Hammer) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world))"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:72-76"
  - id: "Dark World Village of Outcasts - 1"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(Hammer) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world))"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:72-76"
  - id: "Dark World Village of Outcasts - 2"
    region: DarkWorld_NorthWest
    can_reach: "HAS_ITEM(Hammer) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world))"
    source: "app/Region/Standard/DarkWorld/NorthWest.php:72-76"

  # --- Dark World Potion Shop (DarkWorld/NorthEast.php:45) ---
  # Callback (NorthEast.php:74-80): canBunnyRevive OR ((MoonPearl OR
  # (canOWYBA AND hasABottle)) AND (canOneFrameClipOW OR (canBootsClip AND
  # PegasusBoots) OR Hammer OR Flippers OR canLiftRocks)) — NE DW is
  # bunny-enterable post-Agahnim, so the callback re-adds the pearl plus a
  # traversal item to actually cross to the shop.
  - id: "Dark World Potion Shop - 0"
    region: DarkWorld_NorthEast
    can_reach: "CanBunnyRevival(world) OR ((HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanOneFrameClipOW() OR CanBootsClip() OR HAS_ITEM(Hammer) OR HAS_ITEM(Flippers) OR CanLiftRocks()))"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:74-80"
  - id: "Dark World Potion Shop - 1"
    region: DarkWorld_NorthEast
    can_reach: "CanBunnyRevival(world) OR ((HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanOneFrameClipOW() OR CanBootsClip() OR HAS_ITEM(Hammer) OR HAS_ITEM(Flippers) OR CanLiftRocks()))"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:74-80"
  - id: "Dark World Potion Shop - 2"
    region: DarkWorld_NorthEast
    can_reach: "CanBunnyRevival(world) OR ((HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanOneFrameClipOW() OR CanBootsClip() OR HAS_ITEM(Hammer) OR HAS_ITEM(Flippers) OR CanLiftRocks()))"
    source: "app/Region/Standard/DarkWorld/NorthEast.php:74-80"

  # --- Dark World Death Mountain Shop (DarkWorld/DeathMountain/East.php:41;
