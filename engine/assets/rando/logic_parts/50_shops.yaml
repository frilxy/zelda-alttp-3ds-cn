    source: "app/Region/Standard/DarkWorld/South.php:42"
  - id: "Dark World Lake Hylia Shop - 1"
    region: DarkWorld_South
    can_reach: "TRUE()"
    source: "app/Region/Standard/DarkWorld/South.php:42"
  - id: "Dark World Lake Hylia Shop - 2"
