    can_reach: "HAS_ITEM(Hammer) AND HAS_ITEM(Hookshot) AND HAS_AMOUNT(SmallKey_GanonsTower, 4) AND (HAS_ITEM(MoonPearl) OR CanBunnyRevival(world) OR CanPearlBypass())"
