# GanonsTower.yaml — Ganon's Tower Inverted world-state (Phase B Slice 2)
#
# Mechanically translated from `../alttp_vt_randomizer/app/Region/Inverted/GanonsTower.php`
# (MIT, verified per CLAUDE.md "Claim-grounding discipline" §Upstream references).
#
# The Inverted variant `extends Region\Standard\GanonsTower` and calls
# `parent::initalize()` (php:21) before overriding every location predicate
# AND `can_enter`. The Standard parent constructor wires the LocationCollection
# (Bob's Torch, 4 DMs Room, 4 Randomizer Room, Firesnake, Map, Big, 2 Hope,
# Bob's, Tile, 4 Compass Room, Big Key Chest, 2 Big Key Room, 2 Mini Helmasaur,
# Pre-Moldorm, Moldorm Chest + the "Agahnim 2" Prize\Event location), boss
# assignment (Agahnim2 top + Moldorm top + Lanmolas middle + ArmosKnights
# bottom), and the prize_location reference + DefeatAgahnim2 prize item.
# Bob's Torch is NOT overridden in Inverted (the Standard parent predicate
# `HAS_ITEM(Boots)` survives via parent::initalize() — we still emit it here
# for self-containment).
#
# Translation discipline:
#   - Every predicate cites the PHP file:line range it came from.
#   - PHP item-name remappings:
#       * KeyA2 → SmallKey_GanonsTower
#       * BigKeyA2 → BigKey_GanonsTower
#       * CompassA2 → Compass_GanonsTower (unused in this file)
#       * MapA2 → Map_GanonsTower (unused in this file)
#       * PegasusBoots → Boots
#       * RescueZelda → RescuedZelda (NOT used here — Inverted can_enter
#         (php:466-491) drops the RescueZelda gate from the Standard parent).
#   - Phase A collapses (dropped branches):
#       * `itemPlacement === 'basic'` damage-budget gate (php:467-473): drops
#         to TRUE (Phase A target itemPlacement=advanced).
#       * `canDungeonRevive` (php:26,39,52,65, etc.): Phase B → FALSE.
#       * `canOneFrameClipOW` (every location): Phase B trick → FALSE.
#       * `canBootsClip AND Boots` (every location): Phase B trick → FALSE.
#       * `canBunnyRevive AND canBunnyRevive(world)`: Phase B trick → FALSE.
#       * `canOWYBA AND hasABottle`: Phase B trick → FALSE.
#       * `canSuperBunny AND MagicMirror` (php:474-475 in can_enter): Phase B
#         trick → FALSE.
#       * `mode.weapons === 'swordless'` pinned FALSE.
#       * `accessibility !== 'locations'` branches dropped (default=items).
#       * `crystals.tower` defaults to 7 in can_enter.
#       * `itemInLocations(BigKeyA2, [other three slots]) AND KeyA2>=3` →
#         placement-pinned hint; Phase A drops this branch and keeps the
#         conservative `KeyA2>=4` lower bound (same convention as
#         `33_ganons_tower.yaml`).
#       * Map Chest itemPlacement basic-mode boots-substitution branch
#         (php:185-186): drop !=basic; keep Hookshot.
#       * Bob's Chest itemPlacement basic gate: not present in Inverted
#         (Standard's php:286 advanced branch was dropped from the override —
#         Inverted Bob's Chest at php:230-242 does NOT add the
#         `(FireRod || (Ether AND hasSword))` gate. Per the trust-the-code
#         rule we emit the simpler Inverted-only requirement.).
#   - The bunny-state disjunct
#       `(MoonPearl OR canDungeonRevive OR (clip-tricks AND (bunny-revive OR
#         OWYBA)))`
#     appears on EVERY Inverted location predicate. After Phase A collapse,
#     this entire sub-expression reduces to `HAS_ITEM(MoonPearl)`. Since the
#     can_enter edge already enforces MoonPearl, the per-location MoonPearl
#     clauses are redundant in our reachability model BUT they're retained
#     for provenance and to keep the per-location predicates exactly
#     matching the PHP. (Codegen well-formedness will treat them as TRUE
#     after fixed-point.)
#   - Boss kills (reused from `33_ganons_tower.yaml`):
#       * `boss_bottom` = Armos Knights → CanKillArmosKnights()
#       * `boss_middle` = Lanmolas → CanKillLanmolas(world)
#       * `boss_top` = Moldorm → CanKillMoldorm()
#       * `boss` = Agahnim2 → CanKillAgahnim2()
#
# Status: translated 2026-05-27. Awaiting review + codegen integration.

format_version: 1

regions:
  # External parent stubs for cross-file region reference. In Inverted, the
  # GT entrance is on the LIGHT-world side (since the Pyramid of Power
  # location sits in light-world Inverted). Inverted overworld YAMLs define
  # the canonical LightWorld_NorthEast region.
  - id: LightWorld_NorthEast
    name: "Light World - North East (stub, Inverted)"
    source: "stub for cross-file region reference"

  # Re-declared from `33_ganons_tower.yaml` — codegen merges (last-wins).
  - id: GanonsTower_Lobby
    name: "Ganon's Tower - Lobby (Inverted)"
    dungeon: GanonsTower
    source: "app/Region/Inverted/GanonsTower.php:11 (extends Standard\\GanonsTower); base region in app/Region/Standard/GanonsTower.php:15-85"

edges:
  # Inverted can_enter (php:466-491):
  #   (itemPlacement !== 'basic' OR <basic damage budget>)   [drops to TRUE]
  #   AND (canDungeonRevive
  #        OR (canSuperBunny AND MagicMirror)                [Phase B → FALSE]
  #        OR MoonPearl
  #        OR (clip-tricks AND <bunny-revive OR OWYBA>))     [Phase B → FALSE]
  #   AND (Crystal1+Crystal2+...+Crystal7) >= crystals.tower=7
  #   AND NorthEastLightWorld->canEnter
  #
  # Phase A surviving:
  #   HAS_ITEM(MoonPearl) AND <all 7 crystals> AND LightWorld_NorthEast reachable.
  # No RescuedZelda gate (the Inverted override drops it from the Standard).
  - from: LightWorld_NorthEast
    to: GanonsTower_Lobby
    predicate: "(HAS_ITEM(MoonPearl) OR CanBunnyRevival(world) OR CanPearlBypass()) AND HAS_ANY_COUNT([Prize_Crystal1, Prize_Crystal2, Prize_Crystal3, Prize_Crystal4, Prize_Crystal5, Prize_Crystal6, Prize_Crystal7], 7)"
    source: "app/Region/Inverted/GanonsTower.php:466-491 (can_enter closure)"

