# LightWorld/NorthWest.yaml — Inverted LightWorld North West (Phase B Slice 2)
#
# Mechanically translated from `../alttp_vt_randomizer/app/Region/Inverted/LightWorld/NorthWest.php`
# (MIT, verified per CLAUDE.md claim-grounding discipline).
#
# Translation discipline:
#   - Every predicate cites the PHP file:line range it came from.
#   - PHP `PegasusBoots` → registry-canonical `Boots`.
#   - PHP `Powder` → `MagicPowder`.
#   - PHP `PendantOfCourage/Wisdom/Power` → `OP_HAS_PRIZE(Prize_GreenPendant
#     /Prize_BluePendant/Prize_RedPendant)`.
#   - PHP `canBunnyRevive`/`canOWYBA`/`canSuperBunny`/`canBootsClip`/
#     `canOneFrameClipOW`/`canWaterWalk`/`canFakeFlipper`/`canSuperSpeed`/
#     `canMirrorClip`/`canMirrorWrap` are Phase B trick/glitch axes —
#     DROPPED.
#   - PHP `cantTakeDamage` and similar region.* configs DROPPED.
#
# Inverted regional context:
#   - In Inverted, LW-NW is reached via LW-NE (`can_enter` delegates to NE).
#   - "Bunny can pull pedestal" note in PHP (php:35) — bunny CAN interact
#     with the pedestal in Inverted mode, so MoonPearl is NOT required for
#     Master Sword Pedestal (just the three pendants).
#   - Bottle Merchant inherits from Standard parent (no override) — Phase A
#     translates inherited NO-requirements as TRUE(); but in Inverted as
#     bunny, MoonPearl IS needed unless the parent class set TRUE. Standard
#     parent NorthWest.php line 47 has no setRequirements call → default
#     TRUE. In Inverted-as-bunny, however, NPC interactions like Bottle
#     Merchant SHOULD require MoonPearl. We translate mechanically: PHP
#     inherits TRUE so we emit TRUE. The actual Inverted-bunny gate is
#     captured at the can_enter edge level (LW entry requires MoonPearl
#     paths per NorthEast.yaml).
#
# DROPPED locations (not in location_registry.yaml):
#   - Shops "Bush Covered House", "Bomb Hut" (php:20-33) — shop entities,
#     not placement locations.
#
# Status: translated 2026-05-27. Awaiting review + codegen integration.

format_version: 1

regions:
  - id: LightWorld_NorthWest
    name: "Light World - North West (Inverted)"
    source: "app/Region/Inverted/LightWorld/NorthWest.php:10-223"

edges:
  # `can_enter` (php:217-219): delegates to LW-NE canEnter.
  - from: LightWorld_NorthEast
    to: LightWorld_NorthWest
    predicate: "TRUE()"
    source: "app/Region/Inverted/LightWorld/NorthWest.php:217-219 (can_enter delegates to NorthEast LW)"

locations:
  # `Master Sword Pedestal` (php:36-40): three pendants. "Bunny can pull
  # pedestal" — MoonPearl NOT required.
  - id: "Master Sword Pedestal"
    region: LightWorld_NorthWest
    can_reach: "OP_HAS_PRIZE(Prize_GreenPendant) AND OP_HAS_PRIZE(Prize_BluePendant) AND OP_HAS_PRIZE(Prize_RedPendant)"
    source: "app/Region/Inverted/LightWorld/NorthWest.php:36-40"

  # `King's Tomb` (php:42-60):
  #   PegasusBoots AND
  #   (MoonPearl OR canBunnyRevive OR (canOWYBA AND bottle)) AND
  #   (canLiftDarkRocks OR <complex mirror-clip + canBootsClip +
  #    canOneFrameClipOW + canSuperSpeed cross-region chain>)
  # Phase A retained `Boots AND MoonPearl AND canLiftDarkRocks`.
  # Phase B Slice 4 §7 surfaces: pearl-bypass alternative to MoonPearl,
  # boots-clip + OWG alternatives to canLiftDarkRocks. The complex
  # mirror-clip / canSuperSpeed cross-region disjunct stays dropped
  # (depends on macros not in our trick set).
  - id: "King's Tomb"
    region: LightWorld_NorthWest
    can_reach: "HAS_ITEM(Boots) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND (CanLiftDarkRocks() OR CanBootsClip() OR CanOneFrameClipOW())"
    source: "app/Region/Inverted/LightWorld/NorthWest.php:42-60"

