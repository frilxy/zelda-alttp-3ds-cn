    dispatch: vanilla:0x42
    notes: |
      Heart-refill consumable served by Light/Dark World shops in Retro
      mode. ROM byte 0x42. Transient — restores health on purchase;
      does NOT occupy an inventory slot.
      ALTTPR upstream: ROM byte 0x42 in shop-inventory tables; not a
      named Item class in app/Item.php (modeled inline at shop-region
      construction). Phase B Slice 3a adds the registry entry so the
      shop-dispatch path can route through the placement table.

