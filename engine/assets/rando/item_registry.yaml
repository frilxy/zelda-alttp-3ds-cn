# item_registry.yaml — Phase A item ID registry
#
# Per `randomizer-core / Item pool construction` and tasks.md §3.2.
# Source-of-truth for `#define ITEM_<Name> <numeric_id>` in the generated
# `src/rando/item_ids.h`.
#
# Discipline:
# - IDs are append-only. Removed items keep their slot with `deprecated: true`.
# - Renaming an item does not change its numeric ID.
# - Changing any ID is a `kGeneratorVersion` bump trigger (tasks.md §13.6).
# - Virtual items have no dispatcher entry and no grant path; they exist
#   so logic predicates can reference them (e.g., StartingHeart for the
#   hearts-total HAS_ANY_COUNT idiom).
# - `dispatch` field documents how §6 instrumentation grants the item:
#     vanilla:<id>      — route via existing Link_ReceiveItem(<id>, …)
#     progressive_*     — new helper (§0.4.1) that increments link_item_*
#     dungeon_item_*    — OR-into-bit by *placed* dungeon
#     rupee_tier        — new path that adds value to link_rupees_goal
#     bottle_contents:N — find empty bottle slot, write code N
#     prize_*           — OR-into-bit on link_has_crystals / link_which_pendants
#                         for *placed* dungeon (not current_dungeon)
#     direct_*          — new direct-write code (no kReceiveItemGfx entry)
#     virtual           — no grant path; logic-only

