# Reviewed pot-room region (+ optional gate) overrides — design D8.
#
# gen_pot_tables.py auto-resolves the region for pot rooms that flood cleanly from
# a chest/boss anchor through reciprocal doors (147/164, cross-validated against
# chest logic regions). The rooms here are the ones it CAN'T auto-resolve:
# stair-only / one-way-drop dungeon rooms, dungeon-boundary conflicts, non-uniform
# chest rooms (chests differ in gate), and overworld caves/houses. Each was
# determined from EVIDENCE (door + vertical-stair connectivity, entrance names,
# the chest predicates, ALTTP geography) — not memory — and is noted below.
#
# `room_can_reach` is the pot's reachability predicate (all pots in a room share
# it). For a non-uniform chest room the pot inherits the ROOM-ENTRY (most
# permissive chest) predicate — always >= the true room-entry, so it over-gates at
# worst (safe; under-gating is the softlock risk). Omitted = TRUE() (freely
# reachable once the region is).
#
# Authored 2026-06-19 (Phase 2c). VERIFY in the owner playtest (esp. 0x096).

room_region:
  # --- dungeon rooms (resolved by door / vertical-stair connectivity) ---
  "016": SwampPalace           # Swamp Waterway. Engine-room alias: chest room 0x16 is Pyramid Fairy, but this pot room/drop is Swamp Palace.
  "017": TowerOfHera_Lobby     # vstair: up 007 (boss) + down 027 (chest) both ToH — tower column
  "031": TowerOfHera_Lobby     # room-id alias: the only liftable pots at 0x031 are Hera, not HCE sewers
  "041": HyruleCastleEscape    # Hyrule Dungeon side; 0x031's liftable-pot alias is handled above.
  "04b": PalaceOfDarkness      # PoD Jelly-Hall/Mimics loot pots (Arrow10 + HeartRefill).
                               # Corrects grid-flood across the PoD/GT engine-room
                               # boundary at 0x4b|0x4c. door_tables dungeon=5 (PoD),
                               # reached lobby->warp-room->warp-hint key-FREE. Gate
                               # below is the in-dungeon predicate.
  "054": SwampPalace           # Swamp Attic (door_tables room=0x54, dungeon=6), not TT.
  "056": SkullWoods            # Skull 2 West Lobby + West Lobby Pot Key, not Swamp.
  # Rooms 0x43 + 0x53 are Desert Palace, not TT/HCE. The grid-flood binds
  # 0x43->ThievesTown and the stale override bound 0x53->HCE, so keep the
  # correction here where regeneration preserves it.
  "043": DesertPalace_Lobby    # Desert Tiles 2 — was mislabeled ThievesTown (grid-flood)
  "053": DesertPalace_Lobby    # Beamos Hall — was mislabeled HyruleCastleEscape (old override)
  "05b": GanonsTower_Lobby     # GT Hidden Spikes (door_tables room=0x5b, dungeon=12), not PoD.
  "064": ThievesTown           # Thieves Attic / Cricket Hall Left, not Desert.
  "06b": GanonsTower_Lobby     # GT Crystal Paths / Dash Hall / Mimics shared physical room, not PoD.
  "082": HyruleCastleEscape    # Hyrule Dungeon South Abyss, not Desert.
  "091": MiseryMire_Lobby      # Mire Falling Foes, not Desert.
  "092": MiseryMire_Lobby      # Mire Crystal / Shooter Rupees, not Desert.
  "093": MiseryMire_Lobby      # Mire Dark Shooters / Key Rupees, not Desert.
  "096": GanonsTower_Lobby     # GT Staredown / Torch Cross (8 loot/empty pots).
                               # Corrects supertile-grid adjacency from 097->087;
                               # it is not dungeon membership. door_tables dungeon=12
                               # (GT), regions 559/561. Behind the GT big-key door.
  "0b0": HyruleCastleTower     # HCT Circle-of-Pots / upper tower room (door_tables room=0xb0, dungeon=4), not Mire.
  "0b4": TurtleRock_Lobby      # 2 of 3 grid neighbors TR (0c4 dn, 0b5 E); W 0b3 = MM. boundary — playtest
  "0c0": HyruleCastleTower     # HCT dark upper-tower room (door_tables room=0xc0, dungeon=4), not Mire.
  # --- non-uniform chest rooms (chests agree on region, differ on gate) ---
  "01a": PalaceOfDarkness      # PoD Big Chest room (Big/Compass/Hellway chests)
  "02a": PalaceOfDarkness      # PoD Arena (Ledge/Bridge chests)
  "058": SkullWoods            # SW "Skull Woods 3 (Drop In)" — Map Chest is TRUE() -> freely enterable
  "08c": GanonsTower_Lobby     # GT Hope Room — TRUE() chests -> freely enterable
  # --- overworld caves/houses (bind to the overworld region of the entrance) ---
  "0e4": LightWorld_DeathMountain_West   # DM Elder's (Old Man) Cave, lower — Old Man region = DM_West
  "0e5": LightWorld_DeathMountain_West   # DM Elder's Cave, upper
  "0eb": LightWorld_DeathMountain_East   # DM Cape Heart-Piece Cave — east cape (Paradox/Spiral = DM_East)
  "0f1": LightWorld_DeathMountain_West   # DM Express, upper — west ascent
  "101": LightWorld_NorthWest            # Snitch House (Kakariko)
  "102": LightWorld_NorthWest            # Sick Kid's House; explicit 0x1xx cave binding so it never depends on cross-room flood.
  "103": LightWorld_NorthWest            # Kakariko Tavern / Pub / Inn
  "104": LinksHouse                      # Link's House; room-keyed special case, not a shuffled cave entrance
  "105": LightWorld_NorthEast            # Sahasrahla's Hut
  "106": DarkWorld_NorthWest             # Village of Outcasts Chest Game / Orphanage
  "107": LightWorld_NorthWest            # Kakariko Storage Shed
  # --- shared or special cave interiors that need explicit regions instead of flood output ---
  "10c": LightWorld_DeathMountain_East   # Fairy Cave 2 pot side of the shared Mimic/Fairy interior; the Mimic chest gate does not apply to this pot.
  "114": DarkWorld_Mire                  # Pond of Wishing, DW-mire side (entrance 0x62, F12: room 0x114, cached exit screen 0x70): pots reached from DW Mire behind the north bomb wall. (F12 on LW waterfall door 0x5C: room 0x114, cached exit screen 0x0F, pot-LESS fairy side; flood had wrongly said LinksHouse.)
