# Per-cluster region/gate for SHARED cave interiors reached by DIFFERENT overworld
# entrances with DIFFERENT logic. The room-level room_region can't carry two
# reachability classes; each cluster lists its pos4 set + region + can_reach. The
# generator HARD-FAILS if any pot in a listed room isn't covered by a cluster.
pot_room_split:
  # Swamp Palace room 0x036 - the top-right pair is reachable before the Hookshot
  # gap; the other six pots share the Flooded Room / Waterfall Hookshot gate.
  "036":
    - region: SwampPalace
      can_reach: "HAS_ITEM(SmallKey_SwampPalace) AND HAS_ITEM(Hammer)"
      pos4: [0x046c, 0x0470]
    - region: SwampPalace
      can_reach: "HAS_ITEM(Hookshot) AND HAS_ITEM(SmallKey_SwampPalace) AND HAS_ITEM(Hammer)"
      pos4: [0x05bc, 0x05c0, 0x0f9a, 0x0fde, 0x100a, 0x1072]

  # refill_cave_1 (room 0x11b) — one shared interior split by entrance. The two
  # halves are physically separate:
  #   * 8 front pots (0x16-0x19 plane) reached from the GRAVEYARD-LEDGE mirror
  #     spot (screen 0x14). They use the Graveyard Ledge cave-entry route; only
  #     the freestanding item behind the bomb wall needs CanBombThings().
  #   * 6 pots (0x35-0x38 plane) reached from CAVE 45 / the DW-south mirror spot
  #     (screen 0x32). Gate = the fork's "Cave 45" (41_lightworld_south).
  "11b":
    - region: LightWorld_NorthWest
      can_reach: "(HAS_ITEM(MagicMirror) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass()) AND OP_REGION_REACHABLE(DarkWorld_NorthWest)) OR CanBootsClip() OR CanOneFrameClipOW() OR (CanSuperSpeed() AND CanSpinSpeed())"
      pos4: [0x165c, 0x1660, 0x175c, 0x1760, 0x185c, 0x1860, 0x195c, 0x1960]
    - region: LightWorld_South
      can_reach: "(HAS_ITEM(MagicMirror) AND OP_REGION_REACHABLE(DarkWorld_South)) OR CanBootsClip() OR CanOneFrameClipOW()"
      pos4: [0x3518, 0x3618, 0x3718, 0x381c, 0x3620, 0x3628]

  # Room 0x124 is shared by the LightWorld_NorthWest Pegasus Rocks chest side
  # and the south/desert path Heart Piece Cave 1 pot side. The liftable pots are
  # on the south side, entered through entrance 0x6d after pulling the rock.
  "124":
    - region: LightWorld_South
      can_reach: "CanLiftRocks()"
      pos4: [0x1414, 0x1428, 0x1514, 0x1528, 0x1614, 0x1628, 0x1818, 0x181c, 0x1820, 0x1824]

  # Room 0x125 is shared by LightWorld_South and DarkWorld_South rock caves at
  # the same map location. F12 evidence: entrance 0x6f exits to LW screen 0x37;
  # entrance 0x70 exits to DW screen 0x77. Both sides need the Power Glove rock.
  # The light-side room has the four rupee pots; the dark-side room has the four
  # heart-refill pots.
  "125":
    - region: LightWorld_South
      can_reach: "CanLiftRocks()"
      pos4: [0x1918, 0x191c, 0x1920, 0x1924]
    - region: DarkWorld_South
      can_reach: "CanLiftRocks() AND (HAS_ITEM(MoonPearl) OR CanPearlBypass())"
      pos4: [0x1658, 0x1664, 0x1c58, 0x1c64]
