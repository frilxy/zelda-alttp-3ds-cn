  "11f": LightWorld_NorthWest            # Lumberjack's House (entrance 0x6B, by the Sanctuary) — 2 pots; LIGHT, sphere-0 in Open / RescuedZelda in Standard (= the LW_NW access edge). The 0x46 Kakariko-shop side of this shared interior has no liftable pots. Corrected from DarkWorld_NorthWest.
  "127": DarkWorld_NorthWest             # Hammer Pegs cave / Heart Piece Cave 3 (entrance 0x83). F12/playtest: DW_NW hammer-pegs cave; pots share the Hammer Pegs heart-piece access.

room_can_reach:
  # Non-uniform chest rooms whose room-entry is NOT free — the most-permissive
  # (room-entry) chest predicate, copied verbatim from the chest logic:
  "01a": "HAS_AMOUNT(SmallKey_PalaceOfDarkness, 3)"   # PoD Compass Chest (same room)
  "02a": "CanShootArrowsL1()"                          # PoD Arena Ledge
  # --- HCE sewers (gate-only: these rooms flood to HyruleCastleEscape fine, but
  # are chest-LESS so they defaulted to TRUE; the dark-flag Lamp gate alone misses
  # the world-state HCE combat rule and the SmallKey-locked sewer door).
  # Grounded in the door graph + base predicates (logic.yaml): the locked doors sit
  # at the key-room entrances (Secret Rooms 011, Sanctuary 012); the Dark Cross
  # (032) is the no-key floor `HCE combat AND Lamp`. 002 is a dead-end reached only
  # THROUGH the key-locked Sanctuary -> needs the key; 021 sits on the Dark-Cross
  # side, before the locked door -> HCE combat+Lamp (021 was already Lamp-gated
  # by the dark flag but missing combat). Room 031's liftable pots are ToH, not HCE.
  # ---
  "002": "CanKillHceThings(world) AND HAS_ITEM(SmallKey_HyruleCastleEscape) AND HAS_ITEM(Lamp)"
  "021": "CanKillHceThings(world) AND HAS_ITEM(Lamp)"
  # --- Eastern Palace: room 0x099 (Eastern Darkness / Eastern Rupees) is
  # entered from room 0x0A9 through Eastern Courtyard N, the vanilla big-key
  # door. The dark-room flag supplied only Lamp navigation, so pot sanity could
  # otherwise put the Eastern big key behind itself here just like enemy checks.
  "099": "(HAS_ITEM(Lamp) OR CanDarkRoomNav()) AND HAS_ITEM(BigKey_EasternPalace)"
  # --- ToH (gate-less region override above): room 0x017 is the stair floor
  # between the Big-Key-gated Big Chest (0x027) and boss (0x007). Region-bound but
  # un-gated (TRUE) -> 12 falsely-sphere-0 pots. Gate = the Big Chest's predicate. ---
  "017": "HAS_ITEM(BigKey_TowerOfHera)"
  # --- GT (region overrides above): room 0x096 is GT Staredown/Torch Cross, behind
  # the GT big-key door (door-graph proven unreachable without it). The small-key
  # economy is layered SEPARATELY by the POT_KEYS wrap (pot_key_depth.gen.yaml has
  # the door-rando GT depths for room 0x96), so this base gate is the big key only.
  # Was wrongly bound to ToH (region + gate) -> 8 pots gated on the wrong dungeon. ---
  "096": "HAS_ITEM(BigKey_GanonsTower)"
  # --- PoD (region override above): room 0x04b loot pots (Arrow10 + HeartRefill)
  # sit in the Jelly-Hall/Mimics area past the bomb/boots wall; reached lobby ->
  # warp-room -> warp-hint by the KEY-FREE route, so no key door gates room entry. ---
  "04b": "(CanBombThings() OR HAS_ITEM(Boots))"
  # --- Swamp interior (gate-only; flood to SwampPalace fine): water-locked, the
  # Map/West/Waterfall side needs the small key (+ Hammer to drain). 0x026
  # flooded as TRUE. (0x038 is reached from the FREE Entrance 0x028 per the door
  # graph, so it is genuinely free — NOT gated.) ---
  "026": "HAS_ITEM(SmallKey_SwampPalace) AND HAS_ITEM(Hammer)"
  # --- Hammer Pegs cave (region override above): the pots are inside the same
  # room as the Hammer Pegs freestanding heart piece, behind the peg field. ---
  "127": "HAS_ITEM(Hammer) AND (HAS_ITEM(MoonPearl) OR CanPearlBypass() OR CanBunnyRevival(world)) AND (CanLiftDarkRocks() OR ((CanFakeFlippers() OR HAS_ITEM(Flippers)) AND (CanOneFrameClipOW() OR CanBootsClip())))"
  # --- Pond of Wishing / Storyteller Cave 3 (region override above): the DW
  # front room is walk-in once DarkWorld_Mire is reachable, but the six pots are
  # behind the north bomb wall. The LW Waterfall Fairy side is pot-less. ---
  "114": "CanBombThings() AND (HAS_ITEM(MoonPearl) OR CanPearlBypass())"

  # ===========================================================================
  # Phase 3 — the 21 chest-less TRUE() rooms the POT GUARD surfaced (sphere-0
  # LEAK class: a pot room that flooded into a dungeon region but, being
  # chest-LESS, defaulted to TRUE while actually reachable only past an
  # in-dungeon gate). Each ENTER gate was traced from the door-shuffle compiled
  # door tables (src/rando/door_tables.gen.c — REAL per-door SmallKey/BigKey
  # flags + region graph, authoritative over the grid-adjacency pot_dump, whose
  # listed edges are not always real doors) and cross-checked vs the ALTTPR PHP
  # chest predicates. Of the 21, 11 are GENUINELY FREE (entrance/lobby rooms,
  # free-fall-reachable IP descent rooms, or rooms one real door off a TRUE()
  # chest the guard's direct-neighbor check missed) and are OMITTED below with a
  # note. The 10 real gates follow the never-under-gate rule. Authored 2026-06-20.
  #
  # OMITTED (genuinely FREE — do NOT add an override; left at TRUE):
  #   04a  PoD entrance/lobby room (room 0x4a = "Palace of Darkness" entrance);
  #        you stand in it on entry. Big Key Chest neighbor (0x3a, 5 keys) is a
  #        CHEST gate, not the room floor.
  #   083  DP "Desert West Lobby" — a standalone overworld walk-in portal
  #        (door_portals.yaml: DesertPalace_Lobby, NO predicate). Free on entry.
  #   08c  GT Hope Room/Big Chest room — the Hope Room chests are TRUE() (already
  #        region-bound, un-gated above). Room floor is free; only Big Chest/Bob's
  #        need keys (chest gates).
  #   09c  GT Invisible Catwalk — one real door (flag 0x300, no key) off the free
  #        Hope/Big-Chest room 0x8c; the pot_dump's 0x9c<->0x9b/0x9d edges are
  #        walls, not doors (door_tables.gen.c). Free on entry.
  #   0b1  MM — reciprocally door-connected (real doors) to the TRUE() Bridge
  #        Chest free zone via 0xa1; the guard only saw the gated Compass (0xc1)
  #        exit and missed the free side. Free.
  #   0c6  TR central Hub (0xd6/Compass area); the first small-key door is LEAVING
  #        the hub toward Chain Chomps, so the hub itself is pre-key. Somaria is
  #        already a TR-entry requirement (the lobby edge), so no extra gate.
  #   0c7  TR Torches room — free from the Hub (door_tables.gen.c); the Roller
  #        chests (0xb7, FireRod+Somaria) are one real door DEEPER, not here.
  #   04f/05e/08e/09f  IP descent rooms — IP descends via one-way floor HOLES
  #        that are FREE (no key to fall). The placer's IP logic proves the whole
  #        bottom is key-free: Iced T Room (0xae) = TRUE() and Big Chest (0x9e) =
  #        BigKey-only; the only small-key consumers are the boss (2 keys) and the
  #        Spike/Map CHESTS. So these chest-less descent rooms are sphere-0 within
  #        IP — INCLUDING 09f's small-key pot (reachable by the free fall, hence
  #        no deadlock). Over-gating them would contradict Iced T = TRUE(). The
  #        guard fired because each room's one chest NEIGHBOR is gated, but the
  #        free-fall arrival (a hole, not a door) isn't in the pot_dump.
  #        (door-shuffle ON re-models holes as 2-key stairs; irrelevant here.)
  #
  # --- TR interior route (Somaria already required to ENTER the TR lobby).
  # 0x015 = Pipe Pit and 0x023 = Lazy Eyes both sit 3 small-key doors deep on the
  # interior route (Hub NW -> Pokey1 NW -> Chain Chomps Down Stairs;
  # door_tables.gen.c). 0x023 ("Mountainface 1") is interior-route-ONLY
  # (door_portals.yaml: fork_region null — the ledge door never seeds entry). ---
  "015": "HAS_AMOUNT(SmallKey_TurtleRock, 3)"   # TR Pipe Pit — 3 key-doors deep on interior route
  "016": "HAS_ITEM(Hookshot) AND HAS_ITEM(SmallKey_SwampPalace) AND HAS_ITEM(Hammer)"   # Swamp Waterway engine-room alias
  "023": "HAS_AMOUNT(SmallKey_TurtleRock, 3)"   # TR Lazy Eyes — interior-route-only, 3 key-doors deep
  # --- PoD: room 0x01b's ONLY in-PoD entry is through the Map Chest room (0x2b,
  # CanShootArrows — the eyeball-switch wing); it dead-ends to the dark 0x0b. ---
  "01b": "CanShootArrowsL1()"                   # PoD: reached only via the arrow-gated Map Chest wing
  # --- HCT: room 0x0b0 is the upper Castle Tower circle/pot room. It is reached
  # after the first key door and dark tower traverse; use the same floor gate as
  # "Castle Tower - Dark Maze" (room 0x0d0), where the route first enters that
  # section. Corrects the grid-flood from neighboring Mire rooms. ---
  "0b0": "(HAS_ITEM(Lamp) OR CanDarkRoomNav()) AND HAS_ITEM(SmallKey_HyruleCastleTower)"
  # --- SW: from the "Skull Woods Boss Lair" drop (room 0x59), one small-key door
  # ("Skull 3 Lobby NW", door_tables.gen.c) gates the 0x49 pocket; the FireRod
  # fire-curtain is DEEPER (Vines->boss), so standing in 0x49 = 1 key, no FireRod.
  # MoonPearl is auto-added by the DW-region rule. LOW CONFIDENCE (SW drop-in
  # topology; 0x49 holds only empty/magic/heart pots, so a no-key over-estimate is
  # harmless). ---
  "049": "HAS_ITEM(SmallKey_SkullWoods)"        # SW: 1 key-door from the boss-lair drop. LOW CONFIDENCE
  # --- Swamp: room 0x54 is Swamp Attic, reached by the West Block Path stairs.
  # Match the Waterfall/Flooded-side threshold; this avoids exposing its loot
  # pots before the deep Swamp route.
  "054": "HAS_ITEM(Hookshot) AND HAS_ITEM(SmallKey_SwampPalace) AND HAS_ITEM(Hammer)"
  # --- TT: room 0x64 is the Attic / Cricket Hall Left shared physical room.
  "064": "HAS_ITEM(SmallKey_ThievesTown) AND HAS_ITEM(BigKey_ThievesTown)"
  # --- DP back entrance: room 0x63 = "Desert Back Lobby", a standalone overworld
  # walk-in portal gated by lifting a rock from the West-exit ledge
  # (door_portals.yaml: predicate CanLiftRocks()). Its small-key POT sits on this
  # FREE entrance floor, BEFORE the only locked door (Tiles 1 Up Stairs, which
  # leads UP/out to 0x53) — so the key pot is reachable WITHOUT a DP key (no
  # deadlock); the gate is just the back-door rock-lift. ---
  "063": "CanLiftRocks()"                       # DP Back Lobby — overworld back-door rock-lift; key pot is pre-key-door
  # Rooms 0x43/0x53 (Desert Palace, rebound to DesertPalace_Lobby above) are reached
  # off the DP back/west rock-lift floor, same as 0x63 — CanLiftRocks(). Keep the
  # canonical region/key/gate binding here so regeneration is faithful.
  "043": "CanLiftRocks()"
  "053": "CanLiftRocks()"
  # --- GT Gauntlet hallways (chest-less transit 0x5d/0x6c/0x6d). Reached
  # Lobby -> 0x6b -> Mimics (need a bow to kill them, CanShootArrows) -> one
  # small-key door (door_tables.gen.c) into the gauntlet; all interior gauntlet
  # doors are then free. These hold loot pots (no key). ---
  "05d": "CanShootArrowsL1() AND HAS_AMOUNT(SmallKey_GanonsTower, 1)"   # GT Gauntlet: Bow (Mimics) + 1 key-door
  "06c": "CanShootArrowsL1() AND HAS_AMOUNT(SmallKey_GanonsTower, 1)"   # GT Gauntlet: Bow (Mimics) + 1 key-door
  "06d": "CanShootArrowsL1() AND HAS_AMOUNT(SmallKey_GanonsTower, 1)"   # GT Gauntlet: Bow (Mimics) + 1 key-door
  "05b": "CanShootArrowsL1() AND HAS_AMOUNT(SmallKey_GanonsTower, 1)"   # GT Hidden Spikes lower route
  "06b": "CanShootArrowsL1()"                                           # GT Crystal Paths / Dash Hall / Mimics shared room
  # --- GT room 0x9b holds a small-key POT and sits in the Hookshot/Hammer wing
  # behind a small-key door (Double Switch EN, door_tables.gen.c); its only chest
  # neighbor (Map Chest 0x8b = Hammer+Hookshot+4keys) corroborates the wing +
  # key. Trace minimum to STAND here = Hammer+Hookshot+1 key (the 4-key chest gate
  # is deeper). The key pot is non-blocking: GT has 4 keys and the wing yields
  # earlier keys, so the assumed-fill never needs THIS pot's key to reach it. ---
  "09b": "HAS_ITEM(Hammer) AND HAS_ITEM(Hookshot) AND HAS_AMOUNT(SmallKey_GanonsTower, 1)"   # GT Hookshot wing key-pot room
  # --- HCE: room 0x82 is Hyrule Dungeon South Abyss. The HCE key-depth table
  # carries the small-key layer; the room floor still needs the escape combat gate.
  "082": "CanKillHceThings(world)"
  # --- Mire deep rooms: 0x91-0x93 are the Falling Foes / Crystal / Dark Shooters
  # cluster, not Desert. Use the Big-Key/Compass-side torch + 3-key threshold.
  "091": "CanLightTorches() AND HAS_AMOUNT(SmallKey_MiseryMire, 3)"
  "092": "(HAS_ITEM(Lamp) OR CanDarkRoomNav()) AND CanLightTorches() AND HAS_AMOUNT(SmallKey_MiseryMire, 3)"
  "093": "(HAS_ITEM(Lamp) OR CanDarkRoomNav()) AND CanLightTorches() AND HAS_AMOUNT(SmallKey_MiseryMire, 3)"
  # --- TR: room 0x0b4 is Final Abyss, on the Eye Bridge path.
  "0b4": "(HAS_ITEM(Lamp) OR CanDarkRoomNav()) AND HAS_ITEM(CaneOfSomaria) AND HAS_ITEM(BigKey_TurtleRock) AND HAS_AMOUNT(SmallKey_TurtleRock, 3) AND (HAS_ITEM(Cape) OR HAS_ITEM(CaneOfByrna) OR CanBlockLasers())"
  # --- HCT: room 0x0c0 is the dark upper-tower room adjacent to 0x0b0.
  "0c0": "(HAS_ITEM(Lamp) OR CanDarkRoomNav()) AND HAS_ITEM(SmallKey_HyruleCastleTower)"

# Reviewed-FREE rooms the leak guard would otherwise flag (full rationale in the
