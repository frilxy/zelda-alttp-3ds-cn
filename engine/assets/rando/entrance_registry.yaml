# entrance_registry.yaml — Cave-interior registry for entrance shuffle (Phase C)
#
# GROUND-TRUTH DATA ARTIFACT. Do not hand-edit numeric room ids / entrance ids
# without re-deriving from the cited sources below.
#
# Purpose
# -------
# Entrance shuffle permutes overworld cave doors. The runtime redirect chain is:
#   overworld door-slot  --kOverworld_Entrance_Id[lx]-->  entrance-id
#   entrance-id          --kEntranceData_rooms[i]------->  room (0x1xx)
# (See src/overworld.c:3342 `which_entrance = kOverworld_Entrance_Id[lx];` and
#  src/dungeon.c:8448 `dungeon_room_index = kEntranceData_rooms[i];`.)
#
# A "cave interior" is usually one single-screen room in [0x100,0x180). The shuffleable
# cave entrance-ids are 0x3C..0x72 and 0x83..0x84 (57 ids) backing rooms
# 0x100..0x127. Several entrance-ids load the SAME room (e.g. 0x42/0x43/0x44 ->
# 0x103), so the 57 ids collapse to 38 distinct cave interiors that carry an
# overworld entrance. Linked subrooms reached from one of those interiors, such
# as Blind's Hideout back room 0x11D, are bound to the parent entrance row.
# Link's House 0x104 holds a chest but has no cave entrance-id and is NOT
# shuffled here (see `excluded:` block).
#
# The CLOSED FORM this file serves: under cave permutation, a cave location's
# new effective logic region = the vanilla `region` of whichever cave-interior
# *slot* it lands on, AND its reachability is additionally gated by that slot's
# `can_enter` predicate. So each interior records {rooms, entrance_ids, region,
# can_enter, locations}.
#
# Provenance of each column
# --------------------------
#  - entrance_id -> room : assets/tables.py `kEntranceNames` (the authoritative
#      vanilla US-ROM entrance-id -> room table; index = entrance-id, the
#      `[Room #NNN]` decimal prefix = room id). Verified entrance-id range
#      0x3C..0x72,0x83..0x84.
#  - chest location -> room : decoded (one-time, during authoring) from the
#      vanilla US chest room-words joined to assets/chest_data.py
#      `CHEST_NAME_BY_ROM_ADDR`. room = room_word & 0x7FFF. The room values are
#      baked into this file; at codegen time the table is read from the
#      gitignored assets/rando/chest_table.gen.bin (a generated artifact).
#  - region : assets/rando/location_registry.yaml (our 31-region canonical set,
#      enumerated in src/rando/logic_data.c `kRandoRegionNames[31]`). When a
#      cave's chest locations carry a region, that region is used verbatim and
#      cross-checked against the location's overworld area.
#  - locations: [ids] : numeric ids from location_registry.yaml.
#
# Region values are the LOGIC-GRAPH regions actually used by our placer
# (location_registry.yaml is the source of truth, NOT ALTTPR PHP, per the
# project's claim-grounding discipline). Note that location_registry uses the
# OVERWORLD-AREA region for cave locations (e.g. Hype Cave chests = DarkWorld_
# South), not a per-cave region — there is no per-cave region in the 31-region
# set. That is exactly the behaviour entrance shuffle needs: the "vanilla
# region of the slot" is the overworld area the cave door sits in.
#
# Schema
# ------
# interiors:
#   - interior_id : stable string id (append-only; never renumber)
#     name        : human label (vanilla cave name)
#     rooms       : [room ids] (hex). Usually one; listed as a list for caves
#                   that span >1 room id (none currently — kept for forward-compat)
#     entrance_ids: [hex] overworld entrance-ids that load this interior
#     door_rows   : [hex] overworld DOOR ROW indices (kOverworld_Entrance_Id
#                   subscripts) that lead here. DERIVED — regenerate with
#                   assets/scripts/gen_entrance_door_rows.py, never hand-edit.
#                   The door row, NOT the entrance id, is the pool's identity
#                   unit: four Dark World shop doors share entrance id 0x60 and
#                   two share 0x58, so an entrance-id lookup cannot tell them
#                   apart. ALTTPR's `PreviousOverworldDoor` = row + 1.
#     region      : one of the 31 canonical regions (vanilla logic region of
#                   the overworld door). null/omitted only for caves whose
#                   region is ambiguous (flagged in notes).
#     can_enter   : optional source-slot predicate that gates entering this cave
#                   door. Omitted/TRUE() means the region alone is enough.
#     locations   : [location_registry ids] resident in this interior. May be []
#                   for "empty" caves (still shuffle as slots).
#     shop_loc_base: optional location_registry id of this door's shop slot 0
#                   (slots are base..base+2). EMITTED into kCaveInteriors and
#                   read at runtime: a shop travels with its DESTINATION pool
#                   entry, so the resolver goes door row -> source entry ->
#                   installed permutation -> destination entry -> this base.
#                   An entry declaring a base MUST also list base..base+2 in
#                   `locations` (asserted by gen_entrance_table.py) — that is
#                   what makes Entrance_ApplyRegionOverrides rebind the three
#                   slots to whichever door now reaches them, and what brings
#                   the entry under Entrance_SelfCheck (2)'s registry<->logic
#                   region cross-validation.
#     upstream_regions: DERIVED — regenerate with
#                   assets/scripts/gen_entrance_upstream_regions.py --emit,
#                   never hand-edit. Required on every entry with NO locations,
#                   because Entrance_SelfCheck (2) cross-validates `region`
#                   against an entry's own locations and therefore leaves the
#                   location-less entries unverified — this closes that gap.
#                   One row per door that ALTTPR declares a Shop/TakeAny/Upgrade
#                   for, carrying that declaration's region, door id and
#                   file:line. `[]` means upstream declares nothing for any of
#                   this entry's doors.
#                   gen_entrance_door_rows.py --check ENFORCES `region` against
#                   it only when every door is covered AND the rows agree; see
#                   is_pinnable() in the generator for why partial or split
#                   coverage cannot decide (a pool entry deliberately groups
#                   doors that may sit in different regions, and an upstream
#                   take-any is a repurposing of one door rather than a claim
#                   about the interior's primary entrance).
#     notes       : provenance / ambiguity flags.
#
# DO NOT use assets/rando/ow_graph.gen.yaml's `zone` to decide an entry's
# region. It is screen-granular, and a screen can straddle a region boundary:
# dark screen 0x29 carries both the Archery Game (upstream DarkWorld_South) and
# the Frog area (upstream DarkWorld_NorthWest) yet is labelled NorthWest
# throughout, and light screen 0x29 is labelled NorthWest while everything
# upstream and location_registry place on it is LightWorld_South. That method
# produced three false "drift" flags (archery_game, kakariko_library,
# mimic_cave — all three correct) and missed the one real one
# (chest_shell_game). Use upstream_regions.
#
# ORDERING IS LOAD-BEARING — APPEND ONLY, NEVER INSERT OR REORDER. Three
# separate structures are keyed by an interior's POSITION in this list:
# `kRandoCaveSourcePreds` (emitted from `can_enter` by assets/rando_logic_gen.py,
# a DIFFERENT generator than the C interior table), the hard-coded interior
# indices in `Entrance_SelfCheck` check (6), and `kCaveInteriors` itself, whose
# indices are the permutation's index space. (The baked cave-arrival table used
# to be positional too and silently misaligned when two entries were inserted
# mid-list; it is now keyed by `interior_id`.) Splitting an entry therefore
# leaves the original at its index and APPENDS the remainder at the end.
#
# Coverage: all 38 entranced cave interiors, listed as 46 pool entries (the four
# shop-hosting interiors are split per overworld door row). 57 entrance-ids and
# 70 door rows total.

