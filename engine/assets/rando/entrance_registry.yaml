# ===========================================================================
# Dungeon-interior registry for entrance shuffle (Phase C, Stage 2).
#
# Same redirect chain as caves, but DUNGEON interiors are rooms < 0x100:
#   overworld door-slot --kOverworld_Entrance_Id[lx]--> entrance-id
#   entrance-id         --kEntranceData_rooms[i]------> room (< 0x100)
# Dungeon entrance-ids are a DISJOINT lower set (0x08..0x34); none fall in the
# cave range 0x3C..0x72,0x83..0x84 (verified).
#
# Provenance: assets/tables.py kEntranceNames (index = entrance-id; [Room #NNN]
# decimal prefix = room). entry_region cross-checked vs src/rando/logic_data.c
# kRandoEdges door-edges.
#
# v1 SHUFFLED SET = the 6 cleanly single-overworld-entrance dungeons whose entry
# region is the to_region of exactly one door-edge. Multi-entrance (Skull Woods,
# Desert Palace) and 2-region (Eastern Palace) are recorded as `deferred` — they
# need coordinated multi-door / multi-region handling (Stage 2b).
#
# Schema: dungeon_id, name, rooms:[entry room hex <0x100], entrance_ids:[hex],
#   region (overworld area, informational), entry_region (logic region — the
#   edge-overlay key).
# ===========================================================================
dungeons:
  - dungeon_id: palace_of_darkness
    name: "Palace of Darkness"
    rooms: [0x04A]
    entrance_ids: [0x26]
    region: DarkWorld_NorthEast
    entry_region: PalaceOfDarkness
  - dungeon_id: swamp_palace
    name: "Swamp Palace"
    rooms: [0x028]
    entrance_ids: [0x25]
    region: DarkWorld_South
    entry_region: SwampPalace
  - dungeon_id: thieves_town
    name: "Thieves' Town"
    rooms: [0x0DB]
    entrance_ids: [0x34]
    region: DarkWorld_NorthWest
    entry_region: ThievesTown
  - dungeon_id: ice_palace
    name: "Ice Palace"
    rooms: [0x00E]
    entrance_ids: [0x2D]
    region: DarkWorld_South
    entry_region: IcePalace_Lobby
  - dungeon_id: tower_of_hera
    name: "Tower of Hera"
    rooms: [0x077]
    entrance_ids: [0x33]
    region: LightWorld_DeathMountain_West
    entry_region: TowerOfHera_Lobby
  - dungeon_id: hyrule_castle_tower
    name: "Hyrule Castle Tower (Agahnim's Tower)"
    rooms: [0x0E0]
    entrance_ids: [0x24]
    region: LightWorld_NorthEast
    entry_region: HyruleCastleTower
  - dungeon_id: eastern_palace
    name: "Eastern Palace"
    rooms: [0x0C9]
    entrance_ids: [0x08]
    region: LightWorld_NorthEast
    entry_region: EasternPalace_Lobby
    notes: >
      Single overworld door. All EP locations bind to EasternPalace_Lobby (9) +
      EasternPalace_PastArmos (10, child of 9), reached via the one door-edge
      0x11->9. Region 8 ("EasternPalace") is an empty vestigial structural region
      (no locations / no outbound edges), so the real entry region is the Lobby
      (9) and EP fits the single-region model.
  # Multi-entrance dungeons — MAIN door only (extras are "contained": they lead
  # back into the same dungeon, so leaving them vanilla while shuffling the front
  # door is safe). TR + GT entry regions have two inbound overworld edges; the
  # edge-override remaps both together.
  - dungeon_id: desert_palace
    name: "Desert Palace (main)"
    rooms: [0x084]
    entrance_ids: [0x09]
    region: LightWorld_South
    entry_region: DesertPalace_Lobby
    notes: "Main door 0x09 only; East 0x0A / West 0x0B / Boss 0x0C stay vanilla."
  - dungeon_id: turtle_rock
    name: "Turtle Rock (main)"
    rooms: [0x0D6]
    entrance_ids: [0x35]
    region: DarkWorld_DeathMountain_East
    entry_region: TurtleRock_Entrance
    notes: >
      Main door 0x35 only; mountainface doors stay vanilla. Entry region has two
      inbound edges (LW+DW Death Mountain) — override remaps both. Medallion gate
      lives in the door predicate (kept with the door).
  - dungeon_id: ganons_tower
    name: "Ganon's Tower (advanced opt-in)"
    rooms: [0x00C]
    entrance_ids: [0x37]
    region: DarkWorld_DeathMountain_East
    entry_region: GanonsTower_Lobby
    notes: >
      ADVANCED OPT-IN ONLY (shuffle_ganons_tower_entrance; default off). GT joins
      the pool as the 11th dungeon. Its crystal-tower gate lives in the door-edge
      predicate, so under the shuffle it gates whatever lands behind GT's door
      behind crystals.tower crystals — circular at high crystals when that's a
      crystal-bearing dungeon. The full-reachability retry gate rejects circular
      permutations (never ships an unreachable seed); at crystals.tower=7 the retry
      finds a clean permutation in testing, at 0 it always works. Two inbound
      overworld edges (override remaps both); Pyramid Sanctum entrances stay vanilla.
  - dungeon_id: misery_mire
    name: "Misery Mire"
    rooms: [0x098]
    entrance_ids: [0x27]
    region: DarkWorld_Mire
    entry_region: MiseryMire_Entrance
    notes: >
      Single overworld door, single entry region (one inbound edge 0x02->0x16).
      Medallion gate is in the door-edge predicate (kept with the door by the
      override) — ALTTPR-consistent: MM's tablet is tapped at MM's overworld spot
      to open the door regardless of what's behind it.

# Deferred (NOT shuffled): only Skull Woods remains — unlike DP/TR/GT, its
# multiple entrances are NOT "contained" (they open into genuinely separate
# interior rooms), so the main-door-only approach doesn't apply; it needs a real
# multi-entrance "move-as-a-unit" (or per-door) mechanism.
#  - skull_woods: multi-entrance (front 0x28; secondaries 0x29/0x2A/0x2B + drop-ins).
#  - desert_palace: multi-entrance (front 0x09; East 0x0A / West 0x0B / Boss 0x0C).
#  - turtle_rock: multi-entrance (Main 0x35 + mountainface) + medallion + 2 sources.
#  - ganons_tower: two overworld sources + goal region + crystal gate.
